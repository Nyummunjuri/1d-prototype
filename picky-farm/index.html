<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Picky Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: charming, relaxing, a tidy little farm toy that teaches itself
   IDEA: a wooden planter box of soil tiles with carved water grooves
   PICTURE: the plot itself, chunky low-poly tiles with depth, filling the screen
   COLOUR and TYPE: meadow green ground, warm soils, water blue accent; Fredoka
   LAYOUT: phone column: title bar, plot, seed tray + flow button */
:root{color-scheme:light dark;--bg:light-dark(#a9d774,#1c3122);--bg2:light-dark(#93c75f,#16281b);--ink:light-dark(#22361a,#eaf5dc);--card:light-dark(#fff8ea,#2a4230);--line:light-dark(#e6d8b8,#3d5a42);--water:#3fa9e0;--sel:light-dark(#22361a,#ffe9a8)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg2);color:var(--ink);font:16px/1.4 Fredoka,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{position:relative;max-width:520px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 40%,var(--bg),var(--bg2));overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:12px 14px 4px}
h1{font-size:26px;line-height:1.05;margin:0;font-weight:700;flex:1}
h1 small{display:block;font-size:13px;font-weight:500;opacity:.75}
.btn{font:inherit;font-weight:600;border:0;border-radius:14px;min-height:44px;min-width:44px;padding:0 12px;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn:focus-visible,.card:focus-visible,.chip:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
.cues{display:flex;align-items:center;gap:6px;padding:4px 14px 0;font-size:13px}
.cues[hidden]{display:none}
.cues span{opacity:.75}
.chip{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:999px;min-height:34px;padding:0 9px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--card);border-color:var(--sel)}
.chip.hint{margin-left:auto;background:#ffd24a;border-color:#e0a91c;color:#3b2a05;font-weight:600}
.board{position:relative;flex:1;touch-action:none}
.board>canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#toast{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:14px;font-size:15px;font-weight:500;box-shadow:0 4px 0 var(--line);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
footer{padding:6px 12px calc(12px + env(safe-area-inset-bottom))}
#tray{display:grid;gap:6px;justify-content:center;margin-bottom:10px;touch-action:none}
.card{font:inherit;color:var(--ink);background:var(--card);border:3px solid transparent;border-radius:16px;padding:6px 0 0;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 4px 0 var(--line);cursor:grab;position:relative;touch-action:none}
.card[aria-pressed=true]{border-color:var(--sel)}
.card:disabled{opacity:.35;cursor:default}
.card canvas{width:52px;height:58px}
.card b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card .soil{align-self:stretch;margin-top:3px;display:flex;justify-content:center;gap:3px;padding:6px 5px 7px;border-radius:0 0 12px 12px}.card .soil i{flex:0 1 13px;aspect-ratio:1;border-radius:3px;background:rgba(255,250,235,.6);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.card .n{position:absolute;top:-8px;right:-5px;background:var(--ink);color:var(--card);font-size:12px;font-weight:600;border-radius:10px;padding:0 6px;line-height:19px}
.card.nudge{animation:nudge .45s 2}
.card.gulp{animation:gulp .35s}
@keyframes gulp{40%{transform:scale(1.12)}}
.flyseed{position:fixed;left:0;top:0;width:30px;height:30px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));pointer-events:none;z-index:40}
@keyframes nudge{30%{transform:translateY(-7px)}70%{transform:translateY(2px)}}
#flow{width:100%;min-height:52px;font-size:19px;background:var(--water);color:#fff;box-shadow:0 4px 0 #2a7fae;display:flex;align-items:center;justify-content:center;gap:8px}
#flow svg{width:22px;height:22px}
#flow.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 4px 0 #2a7fae,0 0 0 9px rgba(63,169,224,.28)}}
#win{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,40,20,.28)}
#win[hidden]{display:none}
#win .panel{background:var(--card);border-radius:22px;padding:20px 24px;text-align:center;box-shadow:0 6px 0 var(--line);width:min(300px,86%)}
#win h2{font-size:30px;margin:0 0 6px;line-height:1.05}
#seedBox{margin:2px 0 14px}
#seedBox[hidden]{display:none}
#seedBox small{display:block;font-size:13px;opacity:.7}
#seedCv{width:110px;height:110px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
#seedBox b{display:block;font-size:20px}
@keyframes pop{from{transform:scale(.2) rotate(-20deg)}}
#win .row{display:flex;gap:8px;justify-content:center}
#nextBtn{background:#5cb84a;color:#fff;box-shadow:0 3px 0 #3c8a30}
#hand{position:absolute;left:0;top:0;width:46px;pointer-events:none;z-index:20;transform-origin:18px 4px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25))}
#hand[hidden]{display:none}
#handRing{position:absolute;left:-8px;top:-22px;width:52px;height:52px;border-radius:50%;display:none;background:conic-gradient(#fff8ea var(--p,0deg),rgba(255,248,234,.25) 0);-webkit-mask:radial-gradient(circle,transparent 19px,#000 20px);mask:radial-gradient(circle,transparent 19px,#000 20px)}
#hand canvas{position:absolute;width:44px;height:44px;left:-32px;top:-38px}
#ghost{position:fixed;left:0;top:0;width:56px;height:56px;pointer-events:none;z-index:30;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
#ghost[hidden]{display:none}
#ghostDots,#handDots{display:flex;gap:3px;justify-content:center}
#ghostDots i,#handDots i{width:11px;height:11px;border-radius:50%;background:#fff8ea;border:2px solid #22361a}
#handDots{position:absolute;left:-40px;top:-50px;width:60px}
@media (prefers-reduced-motion:reduce){#flow.pulse,.card.nudge,.card.gulp,#seedCv{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>Picky Farm<small id="lvl">Plot 1</small></h1>
    <button class="btn" id="prev" aria-label="Previous plot">‹</button>
    <button class="btn" id="next" aria-label="Next plot">›</button>
    <button class="btn" id="reset">Restart</button>
  </header>
  <div class="cues" id="cues"><span>Cues</span><button class="chip" data-c="damp">Damp</button><button class="chip" data-c="click">Click</button><button class="chip" data-c="sprout">Sprouts</button><button class="chip hint" id="hint">Hint ×3</button></div>
  <main class="board" id="board">
    <canvas id="cv"></canvas>
    <div id="toast" class="hide"></div>
    <div id="win" hidden><div class="panel"><h2 id="winT">Plot harvested!</h2>
      <div id="seedBox"><small>New seed</small><canvas id="seedCv"></canvas><b id="seedName"></b></div>
      <div class="row"><button class="btn" id="again">Replay</button><button class="btn" id="nextBtn">Next plot</button></div></div></div>
  </main>
  <footer>
    <div id="tray"></div>
    <button class="btn" id="flow"><svg viewBox="0 0 24 24"><path d="M12 2C9 7 5 10.5 5 15a7 7 0 0 0 14 0c0-4.5-4-8-7-13z" fill="#fff"/></svg>Let the water flow</button>
  </footer>
  <div id="hand" hidden><div id="handRing"></div><div id="handDots"></div><canvas id="handSeed"></canvas><svg viewBox="0 0 48 56"><path d="M18 3c3 0 5 2 5 5v17l2-1v-5c0-3 5-3 5 0v6l2-1v-2c0-3 5-3 5 0v4h1c0-3 5-3 5 0v13c0 9-6 15-15 15h-3c-6 0-10-3-13-8L4 32c-2-3 2-6 5-4l4 4V8c0-3 2-5 5-5z" fill="#fff" stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
  <div id="ghost" hidden><canvas id="ghostCv" style="width:56px;height:56px"></canvas><div id="ghostDots"></div></div>
</div>
<script>
{
const SOIL={loam:{top:'#7d4f31',side:'#56341f',groove:'#40261a',wet:'#1f120a',speck:'#93623f'},
            sand:{top:'#e6c07c',side:'#b48b4b',groove:'#a77d40',wet:'#6e4f22',speck:'#f3d69f'},
            clay:{top:'#c96a4b',side:'#8e432c',groove:'#763522',wet:'#45180c',speck:'#da8466'}};
const PL={radish:{name:'Radish',size:1,soil:'sand',acc:'#e8487f'},carrot:{name:'Carrot',size:2,soil:'sand',acc:'#f07f1e'},
  lettuce:{name:'Lettuce',size:2,soil:'loam',acc:'#9ad656'},blueberry:{name:'Blueberry',size:3,soil:'loam',acc:'#6f8cff'},
  corn:{name:'Corn',size:3,soil:'sand',acc:'#ffd21f'},tomato:{name:'Tomato',size:2,soil:'clay',acc:'#ff4b3a'},
  eggplant:{name:'Eggplant',size:3,soil:'clay',acc:'#b06ae0'},cauliflower:{name:'Cauliflower',size:4,soil:'clay',acc:'#fff1cf'},
  sunflower:{name:'Sunflower',size:4,soil:'loam',acc:'#ffc41f'},watermelon:{name:'Watermelon',size:5,soil:'sand',acc:'#3fae4a'}};
// 1-4 hand-designed teaching plots, 5-10 designed by parameters with fixed seeds
const LEVELS=[
  {nk:'radish',map:['aWb'],key:{a:'radish',b:'radish'},seed:1,scramble:0,tut:1},
  {nk:'carrot',map:['aaW','bbr'],key:{a:'carrot',b:'carrot',r:'radish'},seed:2,scramble:0,tut:2},
  {nk:'lettuce',map:['aaW','bb.'],key:{a:'lettuce',b:'lettuce'},seed:3,scramble:1,tut:3},
  {nk:'blueberry',map:['aadW','acde','.cfe'],key:{a:'blueberry',c:'lettuce',d:'carrot',e:'carrot',f:'radish'},seed:4,scramble:2,tut:4},
  {nk:'corn',c:4,r:4,w:1,pool:['corn','carrot','lettuce','blueberry','radish'],need:2,seed:5,mix:.45,tut:5,misplace:'corn'},
  {nk:'tomato',c:5,r:4,w:1,pool:['tomato','corn','blueberry','carrot','lettuce'],need:2,seed:6,mix:.55},
  {nk:'eggplant',c:5,r:5,w:2,pool:['eggplant','tomato','corn','lettuce','radish'],need:2,seed:7,mix:.65},
  {nk:'cauliflower',c:5,r:6,w:2,pool:['cauliflower','eggplant','carrot','blueberry','tomato'],need:2,seed:8,mix:.7},
  {nk:'sunflower',c:6,r:6,w:2,pool:['sunflower','cauliflower','corn','lettuce','tomato'],need:2,seed:9,mix:.8},
  {nk:'watermelon',c:6,r:7,w:3,pool:['watermelon','sunflower','eggplant','blueberry','carrot'],need:2,seed:10,mix:.9}];
const DIRS=[[0,-1,1],[1,0,2],[0,1,4],[-1,0,8]],OPP={1:4,2:8,4:1,8:2};
const rotm=m=>((m<<1)|(m>>3))&15;
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuffle=(arr,rnd)=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const easeBack=t=>1+2.9*(t-1)**3+1.9*(t-1)**2;
const ease=t=>t<.5?2*t*t:1-(-2*t+2)**2/2;

function reach(holes,springs,nb,N){
  const d=new Array(N).fill(Infinity),q=[...springs];springs.forEach(s=>d[s]=0);
  while(q.length){const i=q.shift();for(const[j,b]of nb(i))if(holes[i]&b&&holes[j]&OPP[b]&&d[j]>d[i]+1){d[j]=d[i]+1;q.push(j)}}
  return d;
}
function partition(L,c,N,nb,rnd){
  const own=new Array(N).fill(-1),pieces=[];let tries=0;
  while(pieces.length<L.w&&tries++<400){const i=(rnd()*N)|0;if(own[i]>=0)continue;
    if(!pieces.every(p=>{const j=p.cells[0];return Math.abs(j%c-i%c)+Math.abs(((j/c)|0)-((i/c)|0))>=3}))continue;
    own[i]=pieces.length;pieces.push({kind:'water',cells:[i]})}
  if(pieces.length<L.w)return null;
  const wt=k=>k===L.nk?1.8:k==='radish'?.3:1;
  for(;;){
    let best=-1,bs=9;
    for(let i=0;i<N;i++)if(own[i]<0){const f=nb(i).filter(([j])=>own[j]<0).length;if(f<bs||(f===bs&&rnd()<.3)){bs=f;best=i}}
    if(best<0)break;
    let placed=false;
    for(const k of L.pool.map(k=>[k,-Math.log(rnd()+1e-9)/wt(k)]).sort((a,b)=>a[1]-b[1]).map(x=>x[0])){
      const sz=PL[k].size,cells=[best],set=new Set(cells);
      while(cells.length<sz){const fr=[];for(const q of cells)for(const[j]of nb(q))if(own[j]<0&&!set.has(j))fr.push(j);if(!fr.length)break;const j=fr[(rnd()*fr.length)|0];cells.push(j);set.add(j)}
      if(cells.length===sz){cells.forEach(q=>own[q]=pieces.length);pieces.push({kind:k,cells});placed=true;break}
    }
    if(!placed)return null;
  }
  const cnt=k=>pieces.filter(p=>p.kind===k).length;
  const np=pieces.length-L.w;
  if(cnt(L.nk)<L.need||cnt(L.nk)>Math.ceil(np*.4)||cnt('radish')>2)return null;
  if(new Set(pieces.map(p=>p.kind)).size-1<Math.min(4,L.pool.length-(L.w>1?0:1)))return null;
  const soils=new Set(pieces.filter(p=>p.kind!=='water').map(p=>PL[p.kind].soil));
  if(soils.size<new Set(L.pool.map(k=>PL[k].soil)).size)return null;
  return pieces;
}
function gen(L){
  const c=L.map?L.map[0].length:L.c,r=L.map?L.map.length:L.r,N=c*r,open=new Array(N).fill(true);
  if(L.map)L.map.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='.')open[y*c+x]=false}));
  const nb=i=>{const x=i%c,y=(i/c)|0,o=[];for(const[dx,dy,b]of DIRS){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<c&&ny<r&&open[ny*c+nx])o.push([ny*c+nx,b])}return o};
  for(let a=0;a<9000;a++){
    const rnd=mulberry(L.seed*7919+a);let pieces;
    if(L.map){const ids={};pieces=[];
      L.map.forEach((row,y)=>[...row].forEach((ch,x)=>{const i=y*c+x;if(ch==='.')return;if(ch==='W')return pieces.push({kind:'water',cells:[i]});(ids[ch]=ids[ch]||{kind:L.key[ch],cells:[]}).cells.push(i)}));
      pieces.push(...Object.values(ids))}
    else if(!(pieces=partition(L,c,N,nb,rnd)))continue;
    const soil=new Array(N),springs=pieces.filter(p=>p.kind==='water').map(p=>p.cells[0]),plantsSol=pieces.filter(p=>p.kind!=='water');
    plantsSol.forEach(p=>p.cells.forEach(k=>soil[k]=PL[p.kind].soil));
    springs.forEach(s=>{const ns=nb(s).map(([j])=>soil[j]).filter(Boolean);soil[s]=ns[(rnd()*ns.length)|0]||'sand'});
    const holes=new Array(N).fill(0),comp=new Array(N).fill(-1),fr=[];
    springs.forEach((s,ci)=>{comp[s]=ci;for(const[j,b]of nb(s))fr.push([s,j,b])});
    while(fr.length){const[s,t,bit]=fr.splice((rnd()*fr.length)|0,1)[0];if(comp[t]>=0)continue;comp[t]=comp[s];holes[s]|=bit;holes[t]|=OPP[bit];for(const[j,b]of nb(t))if(comp[j]<0)fr.push([t,j,b])}
    if(!L.map){const sizes=springs.map(()=>0);comp.forEach(k=>k>=0&&sizes[k]++);if(sizes.some(s=>s<4))continue}
    const cand=[...Array(N).keys()].filter(i=>open[i]&&holes[i]&&holes[i]!==15&&!(L.map&&springs.includes(i)));
    const n=L.map?L.scramble:Math.round(cand.length*L.mix),dryNeed=L.map?(n?1:0):Math.ceil(plantsSol.length*.5);
    let mixed=holes.slice(),ok=!n;
    for(let s=0;s<300&&n;s++){mixed=holes.slice();
      for(const i of shuffle(cand,rnd).slice(0,n)){let q=holes[i];for(let t=1+((rnd()*3)|0);t>0;t--)q=rotm(q);if(q===holes[i])q=rotm(q);mixed[i]=q}
      const d=reach(mixed,springs,nb,N);
      if(plantsSol.filter(p=>!p.cells.some(k=>isFinite(d[k]))).length>=dryNeed){ok=true;break}}
    if(!ok&&!L.map)continue;
    const seeds={};plantsSol.forEach(p=>seeds[p.kind]=(seeds[p.kind]||0)+1);
    const specks=[...Array(N)].map(()=>[...Array(5)].map(()=>[rnd()*.8+.1,rnd()*.8+.1,rnd()*.04+.02]));
    return {c,r,N,open,soil,holes:mixed,solved:holes,solvedDist:reach(holes,springs,nb,N),springs,seeds,specks,nb,pieces};
  }
}

/* ---------- sprites (low-poly, drawn at tile centre, s = tile size) ---------- */
function poly(X,pts,fill){X.beginPath();pts.forEach(([x,y],k)=>k?X.lineTo(x,y):X.moveTo(x,y));X.closePath();X.fillStyle=fill;X.fill()}
function disc(X,x,y,r,a,b){X.fillStyle=a;X.beginPath();X.arc(x,y,r,0,7);X.fill();if(b){X.fillStyle=b;X.beginPath();X.arc(x,y,r,-1.57,1.57);X.fill()}}
function oval(X,x,y,rx,ry,rot,f){X.fillStyle=f;X.beginPath();X.ellipse(x,y,rx,ry,rot,0,7);X.fill()}
function leaf(X,ang,len,w,c1,c2,ox=0,oy=0){const ex=Math.cos(ang)*len,ey=Math.sin(ang)*len,px=Math.cos(ang+1.57)*w,py=Math.sin(ang+1.57)*w;
  poly(X,[[ox,oy],[ox+px+ex*.5,oy+py+ey*.5],[ox+ex,oy+ey]],c1);poly(X,[[ox,oy],[ox-px+ex*.5,oy-py+ey*.5],[ox+ex,oy+ey]],c2)}
const SPR={
  radish(X,s){[-2.1,-1.57,-1.05].forEach((a,n)=>leaf(X,a,s*.3,s*.07,'#3c9a35','#5cbf4a',0,-s*.06));
    poly(X,[[-s*.035,s*.13],[s*.035,s*.13],[0,s*.25]],'#f6e9ee');disc(X,0,s*.02,s*.15,'#ee5a8f','#c9306a');oval(X,-s*.06,-s*.03,s*.04,s*.025,-.6,'#ffc2d8')},
  carrot(X,s){poly(X,[[-s*.13,0],[s*.13,0],[s*.07,s*.12],[-s*.07,s*.12]],'#e6781a');poly(X,[[0,0],[s*.13,0],[s*.07,s*.12],[0,s*.12]],'#c9620f');
    [[-.16,-.32],[0,-.38],[.16,-.32]].forEach(([dx,dy],n)=>poly(X,[[-s*.04,0],[s*.04,0],[s*dx,s*dy]],n%2?'#4fae40':'#3c9a35'))},
  lettuce(X,s){for(let a=0;a<7;a++){const an=a/7*6.283;oval(X,Math.cos(an)*s*.17,Math.sin(an)*s*.13-s*.02,s*.14,s*.09,an,a%2?'#6fbf3c':'#86d24b')}
    disc(X,0,-s*.02,s*.12,'#b5e66a','#9fd655');disc(X,-s*.02,-s*.04,s*.06,'#d8f59c')},
  blueberry(X,s){[-2.6,-.5,2.4,.7].forEach((a,n)=>leaf(X,a,s*.3,s*.08,'#2f7d3a','#3f9a46'));
    [[-.1,0],[.09,-.05],[.02,.09],[-.04,-.12],[.13,.07]].forEach(([x,y])=>{disc(X,s*x,s*y,s*.075,'#4a64d8','#33479f');disc(X,s*x-s*.02,s*y-s*.025,s*.018,'#b9c6ff')})},
  corn(X,s){poly(X,[[0,s*.12],[-s*.33,-s*.2],[-s*.04,0]],'#4fae40');poly(X,[[0,s*.12],[s*.33,-s*.16],[s*.04,0]],'#3c9a35');
    poly(X,[[0,-s*.34],[s*.085,-s*.24],[s*.085,s*.07],[0,s*.13],[-s*.085,s*.07],[-s*.085,-s*.24]],'#ffd84a');poly(X,[[0,-s*.34],[s*.085,-s*.24],[s*.085,s*.07],[0,s*.13]],'#e9b822');

        if(d===0){ctx.moveTo(Lx,T);ctx.lineTo(R,T)}else if(d===1){ctx.moveTo(R,T);ctx.lineTo(R,B)}else if(d===2){ctx.moveTo(Lx,B);ctx.lineTo(R,B)}else{ctx.moveTo(Lx,T);ctx.lineTo(Lx,B)}ctx.stroke()})});
    const dry=state==='result'&&!isFinite(p.d),sh=dry&&now<shakeUntil?Math.sin(now/30)*ts*.04:demoPull&&demoPull.id===p.id?Math.sin(now/35)*ts*.035*demoPull.a:0;
    const mood=state==='edit'&&(cue('sprout')||hinting)?(p.cells.some(k=>isFinite(conn[k]))?'awake':'sleepy'):null;
    if(state==='flowing'&&isFinite(p.d)&&tf>=p.d&&!splashed.has(p.id)){splashed.add(p.id);sfx(seep?520:420+splashed.size*70,seep?.06:.12,.18);
      p.cells.forEach(k=>{const[x,y]=center(k);for(let n=0;n<(seep?3:7);n++)parts.push({x,y,vx:(Math.random()-.5)*3,vy:-1.5-Math.random()*2.5,life:.8,col:n%2?'#55bdf0':'#c8efff',drop:1})})}
    p.cells.forEach(i=>{const[cx,cy]=center(i);const k=!seep&&isFinite(p.d)&&tf>=p.d?easeBack(clamp((tf-p.d)/1.4)):0;
      if(k>0)drawPlant(ctx,p.kind,cx,cy,ts,Math.max(.15,k));else drawSprout(cx,cy,ts,dry,sh,mood,now,seep&&isFinite(p.d)&&tf>=p.d?Math.sin(Math.PI*clamp((tf-p.d)/2.5)):0)})});
  if(drag){const p=PL[drag.kind];drag.cells.forEach(i=>{const[cx,cy,x,y,th]=center(i);rr(x+g,y+g,ts-2*g,th,ts*.13);ctx.fillStyle='rgba(255,255,255,.25)';ctx.fill();ctx.strokeStyle=p.acc;ctx.lineWidth=3;ctx.stroke();drawSprout(cx,cy,ts,false,0,null,now)});
}
  parts=parts.filter(q=>(q.life-=.012)>0);parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.06;ctx.globalAlpha=Math.min(1,q.life*1.4);if(q.drop){ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,7);ctx.fill()}else poly(ctx,[[q.x,q.y-5],[q.x+4,q.y],[q.x,q.y+5],[q.x-4,q.y]],q.col)});ctx.globalAlpha=1;
  drawHand(now);
}
load(lvlIdx);requestAnimationFrame(frame);
