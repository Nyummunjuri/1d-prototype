<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Picky Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: charming, relaxing, a tidy little farm toy
   IDEA: a wooden planter box of soil tiles with carved water grooves
   PICTURE: the plot itself, chunky low-poly tiles with depth, filling the screen
   COLOUR and TYPE: meadow green ground, warm soils, water blue accent; Fredoka
   LAYOUT: phone column: title bar, plot, seed tray + flow button */
:root{color-scheme:light dark;--bg:light-dark(#a9d774,#1c3122);--bg2:light-dark(#93c75f,#16281b);--ink:light-dark(#22361a,#eaf5dc);--card:light-dark(#fff8ea,#2a4230);--line:light-dark(#e6d8b8,#3d5a42);--water:#3fa9e0;--sel:light-dark(#22361a,#ffe9a8)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg2);color:var(--ink);font:16px/1.4 Fredoka,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 40%,var(--bg),var(--bg2))}
header{display:flex;align-items:center;gap:8px;padding:12px 14px 4px}
h1{font-size:26px;line-height:1.05;margin:0;font-weight:700;flex:1;letter-spacing:.2px}
h1 small{display:block;font-size:13px;font-weight:500;opacity:.75}
.btn{font:inherit;font-weight:600;border:0;border-radius:14px;min-height:44px;min-width:44px;padding:0 12px;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn:focus-visible,.card:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
.board{position:relative;flex:1;touch-action:none}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

.cues{display:flex;align-items:center;gap:6px;padding:4px 14px 0;flex-wrap:wrap;font-size:13px}
.cues span{opacity:.75;margin-right:2px}
.chip{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:999px;min-height:34px;padding:0 9px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--card);border-color:var(--sel)}
.chip.hint{margin-left:auto;background:#ffd24a;border-color:#e0a91c;color:#3b2a05;font-weight:600}
.chip:focus-visible{outline:3px solid var(--water);outline-offset:2px}
#toast{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:14px;font-size:15px;font-weight:500;box-shadow:0 4px 0 var(--line);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
footer{padding:6px 12px calc(12px + env(safe-area-inset-bottom))}
#tray{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.card{font:inherit;color:var(--ink);background:var(--card);border:3px solid transparent;border-radius:16px;padding:6px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--line);cursor:pointer;position:relative}
.card[aria-pressed=true]{border-color:var(--sel)}
.card:disabled{opacity:.35;cursor:default}
.card svg{width:40px;height:40px}
.card b{font-size:14px;font-weight:600}
.card .pips{display:flex;gap:2px}.card .pips i{width:9px;height:9px;border-radius:2px}
.card .n{position:absolute;top:-8px;right:-6px;background:var(--ink);color:var(--card);font-size:13px;font-weight:600;border-radius:10px;padding:0 7px;line-height:20px}
#flow{width:100%;min-height:52px;font-size:19px;background:var(--water);color:#fff;box-shadow:0 4px 0 #2a7fae;display:flex;align-items:center;justify-content:center;gap:8px}
#flow svg{width:22px;height:22px}
#win{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,40,20,.25)}
#win[hidden]{display:none}
#win .panel{background:var(--card);border-radius:22px;padding:22px 26px;text-align:center;box-shadow:0 6px 0 var(--line);max-width:300px}
#win h2{font-size:30px;margin:0 0 4px;line-height:1.05}
#win p{margin:0 0 14px}
#win .row{display:flex;gap:8px;justify-content:center}
#nextBtn{background:#5cb84a;color:#fff;box-shadow:0 3px 0 #3c8a30}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Picky Farm<small id="lvl">Plot 1 of 5</small></h1>
    <button class="btn" id="prev" aria-label="Previous plot">‹</button>
    <button class="btn" id="next" aria-label="Next plot">›</button>
    <button class="btn" id="reset">Restart</button>
  </header>
  <div class="cues" id="cues"><span>Cues</span><button class="chip" data-c="damp">Damp</button><button class="chip" data-c="click">Click</button><button class="chip" data-c="sprout">Sprouts</button><button class="chip hint" id="hint">Hint ×3</button></div>
  <main class="board" id="board">
    <canvas id="cv"></canvas>
    <div id="toast" class="hide"></div>
    <div id="win" hidden><div class="panel"><h2 id="winT">Plot harvested!</h2><p id="winP"></p><div class="row"><button class="btn" id="again">Replay</button><button class="btn" id="nextBtn">Next plot</button></div></div></div>
  </main>
  <footer>
    <div id="tray"></div>
    <button class="btn" id="flow"><svg viewBox="0 0 24 24"><path d="M12 2C9 7 5 10.5 5 15a7 7 0 0 0 14 0c0-4.5-4-8-7-13z" fill="#fff"/></svg>Let the water flow</button>
  </footer>
</div>
<script>
{
const SOIL={loam:{name:'Loam',top:'#7d4f31',side:'#56341f',groove:'#40261a',wet:'#1f120a',speck:'#93623f'},
            sand:{name:'Sand',top:'#e6c07c',side:'#b48b4b',groove:'#a77d40',wet:'#6e4f22',speck:'#f3d69f'},
            clay:{name:'Clay',top:'#c96a4b',side:'#8e432c',groove:'#763522',wet:'#45180c',speck:'#da8466'}};
const PL={carrot:{name:'Carrot',size:2,soil:'sand',acc:'#f07f1e'},
          basil:{name:'Basil',size:3,soil:'loam',acc:'#55c246'},
          pumpkin:{name:'Pumpkin',size:4,soil:'clay',acc:'#ffc93a'}};
const KIND_BY_SIZE={2:'carrot',3:'basil',4:'pumpkin'};
const LEVELS=[{c:4,r:4,w:1,seed:3,kinds:2},{c:5,r:5,w:1,seed:7,kinds:3},{c:5,r:6,w:2,seed:11,kinds:3},{c:6,r:7,w:2,seed:5,kinds:3},{c:6,r:8,w:3,seed:9,kinds:3}];
const rotm=m=>((m<<1)|(m>>3))&15;
const DIRS=[[0,-1,1],[1,0,2],[0,1,4],[-1,0,8]],OPP={1:4,2:8,4:1,8:2};
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuffle=(arr,rnd)=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const easeBack=t=>{const c1=1.9;return 1+(c1+1)*(t-1)**3+c1*(t-1)**2};

function gen(L){
  const {c,r,w}=L,N=c*r;
  const nb=i=>{const x=i%c,y=(i/c)|0,o=[];for(const[dx,dy,b]of DIRS){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<c&&ny<r)o.push([ny*c+nx,b])}return o};
  for(let a=0;a<6000;a++){
    const rnd=mulberry(L.seed*7919+a),own=new Array(N).fill(-1),pieces=[];
    let tries=0;
    while(pieces.length<w&&tries++<300){const i=(rnd()*N)|0;if(own[i]>=0)continue;
      if(!pieces.every(p=>{const j=p.cells[0];return Math.abs(j%c-i%c)+Math.abs(((j/c)|0)-((i/c)|0))>=3}))continue;
      own[i]=pieces.length;pieces.push({kind:'water',cells:[i]})}
    if(pieces.length<w)continue;
    let ok=true;
    for(;;){
      let best=-1,bs=9;
      for(let i=0;i<N;i++)if(own[i]<0){const f=nb(i).filter(([j])=>own[j]<0).length;if(f<bs||(f===bs&&rnd()<.3)){bs=f;best=i}}
      if(best<0)break;
      let placed=false;
      for(const sz of [...new Set(shuffle([2,3,3,4,4],rnd))]){
        const cells=[best],set=new Set(cells);
        while(cells.length<sz){const fr=[];for(const k of cells)for(const[j]of nb(k))if(own[j]<0&&!set.has(j))fr.push(j);if(!fr.length)break;const j=fr[(rnd()*fr.length)|0];cells.push(j);set.add(j)}
        if(cells.length===sz){const id=pieces.length;cells.forEach(k=>own[k]=id);pieces.push({kind:KIND_BY_SIZE[sz],cells});placed=true;break}
      }
      if(!placed){ok=false;break}
    }
    if(!ok)continue;
    if(new Set(pieces.filter(p=>p.kind!=='water').map(p=>p.kind)).size<L.kinds)continue;
    const soil=new Array(N);
    pieces.forEach(p=>{if(p.kind!=='water')p.cells.forEach(k=>soil[k]=PL[p.kind].soil)});
    pieces.forEach(p=>{if(p.kind==='water'){const ns=nb(p.cells[0]).map(([j])=>soil[j]).filter(Boolean);soil[p.cells[0]]=ns[(rnd()*ns.length)|0]}});
    const holes=new Array(N).fill(0),comp=new Array(N).fill(-1),fr=[];
    pieces.filter(p=>p.kind==='water').forEach((p,ci)=>{const s=p.cells[0];comp[s]=ci;for(const[j,b]of nb(s))fr.push([s,j,b])});
    while(fr.length){const[s,t,bit]=fr.splice((rnd()*fr.length)|0,1)[0];if(comp[t]>=0)continue;comp[t]=comp[s];holes[s]|=bit;holes[t]|=OPP[bit];for(const[j,b]of nb(t))if(comp[j]<0)fr.push([t,j,b])}
    const sizes=new Array(w).fill(0);comp.forEach(k=>sizes[k]++);
    if(sizes.some(s=>s<4))continue;
    // scramble: turn each tile a random number of quarter turns; make sure plenty is disconnected
    const springs=pieces.filter(p=>p.kind==='water').map(p=>p.cells[0]);
    let mixed;
    for(let s=0;s<50;s++){mixed=holes.map(m=>{let q=m;for(let n=(rnd()*4)|0;n>0;n--)q=rotm(q);return q});
      if(reach(mixed,springs,nb,N).filter(isFinite).length<=N*.45)break}
    const seeds={carrot:0,basil:0,pumpkin:0};pieces.forEach(p=>{if(p.kind!=='water')seeds[p.kind]++});
    const specks=[...Array(N)].map(()=>[...Array(5)].map(()=>[rnd()*.8+.1,rnd()*.8+.1,rnd()*.04+.02]));
    return {c,r,w,N,soil,holes:mixed,solved:holes,springs,seeds,specks,nb,pieces};
  }
}
function reach(holes,springs,nb,N){
  const d=new Array(N).fill(Infinity),q=[...springs];springs.forEach(s=>d[s]=0);
  while(q.length){const i=q.shift();for(const[j,b]of nb(i))if(holes[i]&b&&holes[j]&OPP[b]&&d[j]>d[i]+1){d[j]=d[i]+1;q.push(j)}}
  return d;
}

const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),board=document.getElementById('board');
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let lvlIdx=0;try{lvlIdx=Math.min(LEVELS.length-1,+localStorage.getItem('pickyLvl')||0)}catch(e){}
let G,occ,plants,seedLeft,sel,drag,press,state,flowT0,dist,conn,rotT,maxD,flash,shakeUntil,parts,lay={},W=0,H=0,toastTimer,pid=0;

function load(i){
  lvlIdx=i;try{localStorage.setItem('pickyLvl',i)}catch(e){}
  G=gen(LEVELS[i]);occ=new Array(G.N).fill(null);G.springs.forEach(s=>occ[s]={type:'water'});
  plants=[];seedLeft={...G.seeds};rotT=new Array(G.N).fill(-1e9);
  drag=null;press=null;state='edit';dist=null;flash=null;shakeUntil=0;parts=[];
  sel=Object.keys(PL).find(k=>seedLeft[k]>0);
  $('lvl').textContent=`Plot ${i+1} of ${LEVELS.length}`;$('prev').disabled=i===0;$('next').disabled=i===LEVELS.length-1;
  $('win').hidden=true;layout();renderTray();updateConn();renderCues();joints=[];hintUntil=0;
  toast(i===0?'Tap a tile to turn it. Drag to plant':`Plot ${i+1}: ${G.w} springs to connect`,3400);
}
function updateConn(){conn=reach(G.holes,G.springs,G.nb,G.N)}
function toast(t,ms=2400){const el=$('toast');el.textContent=t;el.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hide'),ms)}

const ICON={
  carrot:'<svg viewBox="0 0 40 40"><path d="M20 12l-3-9 3 2 2-4 1 5 4-2-4 8z" fill="#3e9a35"/><path d="M13 13h14l-7 25z" fill="#f08a24"/><path d="M20 13h7l-7 25z" fill="#d46d12"/></svg>',
  basil:'<svg viewBox="0 0 40 40"><path d="M20 34l-11-9 3-13 8 6z" fill="#3c9a35"/><path d="M20 34l11-9-3-13-8 6z" fill="#5cbf4a"/><path d="M20 22l-6-10 6-9 6 9z" fill="#73d35c"/><path d="M20 22V3l6 9z" fill="#4fae40"/></svg>',
  pumpkin:'<svg viewBox="0 0 40 40"><path d="M20 10l-12 3-5 10 5 11h24l5-11-5-10z" fill="#f2a03d"/><path d="M20 10l12 3 5 10-5 11H20z" fill="#d97f22"/><path d="M14 12l-2 22M26 12l2 22" stroke="#c46c14" stroke-width="2"/><path d="M19 11l1-7 3 1-2 6z" fill="#6b4a22"/></svg>',
  water:'<svg viewBox="0 0 40 40"><ellipse cx="20" cy="24" rx="16" ry="11" fill="#2f8fc4"/><ellipse cx="20" cy="22" rx="13" ry="8.5" fill="#55bdf0"/><ellipse cx="16" cy="20" rx="5" ry="2.5" fill="#b9e8ff"/></svg>'};
function renderTray(){
  const cards=Object.keys(PL).filter(k=>G.seeds[k]>0).map(k=>{const p=PL[k];
    return `<button class="card" data-k="${k}" aria-pressed="${sel===k}" ${seedLeft[k]?'':'disabled'}>${ICON[k]}<b>${p.name}</b><span class="pips">${'<i></i>'.repeat(p.size).replaceAll('<i>',`<i style="background:${SOIL[p.soil].top}">`)}</span><span class="n">×${seedLeft[k]}</span></button>`});
  $('tray').style.gridTemplateColumns=`repeat(${cards.length},minmax(0,1fr))`;
  $('tray').innerHTML=cards.join('');
  $('flow').disabled=state==='flowing';
}
$('tray').addEventListener('click',e=>{const b=e.target.closest('.card');if(!b||b.disabled)return;sel=b.dataset.k;renderTray();
  const p=PL[sel];toast(`${p.name}: ${p.size} tiles of ${SOIL[p.soil].name.toLowerCase()}, any shape`)});

function layout(){
  const r=board.getBoundingClientRect(),dpr=devicePixelRatio||1;W=r.width;H=r.height;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!G)return;
  const ts=Math.min(Math.floor((W-36)/G.c),Math.floor((H-60)/G.r),92),dep=Math.round(ts*.13);
  lay={ts,dep,g:Math.max(2,ts*.035),ox:(W-G.c*ts)/2,oy:(H-G.r*ts)/2+14};
}
new ResizeObserver(layout).observe(board);

function cellAt(x,y){const{ts,ox,oy}=lay;const cx=Math.floor((x-ox)/ts),cy=Math.floor((y-oy)/ts);return cx>=0&&cy>=0&&cx<G.c&&cy<G.r?cy*G.c+cx:-1}
function resetFlow(){if(state!=='edit'){state='edit';dist=null;renderTray()}}
const adj=(a,b)=>Math.abs(a%G.c-b%G.c)+Math.abs(((a/G.c)|0)-((b/G.c)|0))===1;

let cues={damp:false,click:true,sprout:true},hintsLeft=3,hintUntil=0,joints=[],splashed=new Set(),actx;
try{Object.assign(cues,JSON.parse(localStorage.getItem('pickyCues')||'{}'))}catch(e){}
function renderCues(){document.querySelectorAll('.chip[data-c]').forEach(b=>b.setAttribute('aria-pressed',!!cues[b.dataset.c]));$('hint').textContent=`Hint ×${hintsLeft}`}
$('cues').addEventListener('click',e=>{const b=e.target.closest('.chip[data-c]');if(!b)return;cues[b.dataset.c]=!cues[b.dataset.c];
  try{localStorage.setItem('pickyCues',JSON.stringify(cues))}catch(e){}renderCues();
  toast(Object.values(cues).some(Boolean)?`${b.textContent} ${cues[b.dataset.c]?'on':'off'}`:'No cues: pure puzzle, hints only')});
$('hint').onclick=()=>{if(state!=='edit'||!$('win').hidden)return;
  if(!hintsLeft)return toast('Out of hints. The shop would open here',2600);
  hintsLeft--;hintUntil=performance.now()+3000;renderCues();toast('Hint: wet grooves and awake sprouts for 3 s')};
function blip(f,v=.1,d=.12){if(!cues.click&&f<900)return;try{actx=actx||new AudioContext();const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.5,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function sfx(f,v,d){try{actx=actx||new AudioContext();const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function rotate(i){resetFlow();G.holes[i]=rotm(G.holes[i]);const now=performance.now();rotT[i]=now;updateConn();
  try{actx=actx||new AudioContext();actx.resume?.()}catch(e){}
  if(!cues.click)return;let n=0;
  for(const[j,b]of G.nb(i))if(G.holes[i]&b&&G.holes[j]&OPP[b]){joints.push({i,j,b,t0:now+170});n++}
  if(n)setTimeout(()=>blip(520+n*120),170)}
function pullPlant(i){const o=occ[i];if(!o||o.type!=='plant')return false;resetFlow();
  const p=plants.find(q=>q.id===o.id);p.cells.forEach(k=>occ[k]=null);plants=plants.filter(q=>q!==p);seedLeft[p.kind]++;sel=p.kind;
  toast(`${PL[p.kind].name} back in the tray`);renderTray();navigator.vibrate?.(15);return true}
function extend(i){const p=PL[drag.kind];
  if(i<0||drag.cells.includes(i)||occ[i]||drag.cells.length>=p.size)return;
  if(!drag.cells.some(k=>adj(k,i)))return;
  if(G.soil[i]!==p.soil){if(!flash||flash.i!==i)flash={i,t:performance.now()};return}
  drag.cells.push(i)}
cv.addEventListener('pointerdown',e=>{
  if(state==='flowing'||!$('win').hidden)return;
  const i=cellAt(e.offsetX,e.offsetY);if(i<0)return;
  cv.setPointerCapture(e.pointerId);
  press={i,done:false,moved:false};
  press.lp=setTimeout(()=>{if(press&&!press.moved&&pullPlant(i))press.done=true},450);
});
cv.addEventListener('pointermove',e=>{
  if(!press)return;const j=cellAt(e.offsetX,e.offsetY);
  if(drag)return extend(j);
  if(j<0||j===press.i||press.done)return;
  press.moved=true;clearTimeout(press.lp);
  const i=press.i;
  if(!sel||!seedLeft[sel]||occ[i]){press.done=true;return}
  const p=PL[sel];
  if(G.soil[i]!==p.soil){flash={i,t:performance.now()};press.done=true;return toast(`${p.name} is picky: ${SOIL[p.soil].name.toLowerCase()} only`)}
  resetFlow();drag={kind:sel,cells:[i]};extend(j);
});
const endDrag=()=>{
  if(press){clearTimeout(press.lp);if(!drag&&!press.moved&&!press.done)rotate(press.i);press=null}
  if(!drag)return;const p=PL[drag.kind];
  if(drag.cells.length===p.size){const id=++pid;drag.cells.forEach(k=>occ[k]={type:'plant',id,kind:drag.kind});plants.push({id,kind:drag.kind,cells:drag.cells});seedLeft[drag.kind]--;
    if(!seedLeft[drag.kind])sel=Object.keys(PL).find(k=>seedLeft[k]>0)||null;renderTray()}
  else toast(`${p.name} needs ${p.size} tiles in a row or bend`);
  drag=null};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);

$('flow').addEventListener('click',()=>{
  dist=reach(G.holes,G.springs,G.nb,G.N);
  maxD=Math.max(0,...dist.filter(isFinite));
  plants.forEach(p=>p.d=Math.min(...p.cells.map(k=>dist[k])));
  const burst=reduce?0:650;state='flowing';flowT0=performance.now()+burst;splashed=new Set();renderTray();
  sfx(180,.18,.5);
  if(!reduce)G.springs.forEach(sp=>{const[x,y]=center(sp);for(let n=0;n<26;n++)parts.push({x,y,vx:(Math.random()-.5)*2.6,vy:-3.5-Math.random()*4,life:1,col:n%3?'#55bdf0':'#c8efff',drop:1})});
});
const flowSpeed=reduce?30:9;
function finish(){
  state='result';renderTray();
  const dry=plants.filter(p=>!isFinite(p.d)),left=Object.values(seedLeft).reduce((a,b)=>a+b,0);
  if(dry.length){shakeUntil=performance.now()+700;toast(`${dry.length} plant${dry.length>1?'s are':' is'} still thirsty. Turn tiles to reach them`,3200)}
  else if(left)toast(`All watered! ${left} seed${left>1?'s':''} still in the tray`,3000);
  else{
    plants.forEach(p=>p.cells.forEach(k=>{const[x,y]=center(k);for(let n=0;n<5;n++)parts.push({x,y,vx:(Math.random()-.5)*2,vy:-2-Math.random()*2.5,life:1,col:PL[p.kind].acc})}));
    const last=lvlIdx===LEVELS.length-1;
    $('winT').textContent=last?'Farm complete!':'Plot harvested!';
    $('winP').textContent=`All ${plants.length} plants are happy and watered.`;
    $('nextBtn').hidden=last;setTimeout(()=>{$('win').hidden=false;$('nextBtn').focus()},900);
  }
}
$('reset').onclick=()=>load(lvlIdx);$('again').onclick=()=>load(lvlIdx);
$('prev').onclick=()=>load(Math.max(0,lvlIdx-1));$('next').onclick=()=>load(Math.min(LEVELS.length-1,lvlIdx+1));
$('nextBtn').onclick=()=>load(Math.min(LEVELS.length-1,lvlIdx+1));

function center(i){const{ts,dep,g,ox,oy}=lay;const x=ox+(i%G.c)*ts,y=oy+((i/G.c)|0)*ts,th=ts-dep-2*g;return[x+ts/2,y+g+th/2,x,y,th]}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function poly(pts,fill){ctx.beginPath();pts.forEach(([x,y],k)=>k?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=fill;ctx.fill()}

function drawSprout(cx,cy,s,wilt,sh,mood,now){
  ctx.save();ctx.translate(cx+sh,cy+s*.12);
  if(mood==='awake'){ctx.rotate(Math.sin(now/260+cx*.05)*.16);ctx.scale(1.3,1.3+Math.sin(now/180+cy)*.06)}
  else if(mood==='sleepy'){ctx.rotate(.38);ctx.scale(.85,.8)}
  else ctx.rotate(wilt?.5:0);
  const g=wilt?'#a3903f':'#5cbf4a',g2=wilt?'#8a7633':'#3e9a35';
  ctx.strokeStyle=g2;ctx.lineWidth=s*.04;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-s*.18);ctx.stroke();
  poly([[0,-s*.16],[-s*.17,-s*.26],[-s*.05,-s*.12]],g);poly([[0,-s*.16],[s*.17,-s*.28],[s*.05,-s*.12]],g2);
  ctx.restore();
}
function drawPlant(kind,cx,cy,s,k){
  ctx.save();ctx.translate(cx,cy);ctx.scale(k,k);
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(0,s*.16,s*.28,s*.1,0,0,7);ctx.fill();
  if(kind==='basil'){
    for(let a=0;a<5;a++){const an=a/5*Math.PI*2-Math.PI/2,ex=Math.cos(an)*s*.3,ey=Math.sin(an)*s*.24,px=Math.cos(an+1.57)*s*.09,py=Math.sin(an+1.57)*s*.07;
      poly([[0,0],[px+ex*.5,py+ey*.5],[ex,ey]],'#3c9a35');poly([[0,0],[-px+ex*.5,-py+ey*.5],[ex,ey]],'#5cbf4a')}
    poly([[0,-s*.2],[-s*.09,-s*.02],[0,s*.04]],'#79d862');poly([[0,-s*.2],[s*.09,-s*.02],[0,s*.04]],'#5ab84a');
  }else if(kind==='carrot'){
    poly([[-s*.13,0],[s*.13,0],[s*.07,s*.12],[-s*.07,s*.12]],'#e6781a');poly([[0,0],[s*.13,0],[s*.07,s*.12],[0,s*.12]],'#c9620f');
    [[-.16,-.32],[0,-.38],[.16,-.32]].forEach(([dx,dy],n)=>poly([[-s*.04,0],[s*.04,0],[s*dx,s*dy]],n%2?'#4fae40':'#3c9a35'));
  }else{
    const R=s*.27;poly([[-R,-R*.2],[-R*.6,-R*.75],[0,-R*.8],[0,R*.7],[-R*.6,R*.7],[-R,R*.15]],'#f2a03d');
    poly([[R,-R*.2],[R*.6,-R*.75],[0,-R*.8],[0,R*.7],[R*.6,R*.7],[R,R*.15]],'#d97f22');
    ctx.strokeStyle='#c46c14';ctx.lineWidth=s*.025;ctx.beginPath();ctx.moveTo(-R*.35,-R*.7);ctx.lineTo(-R*.4,R*.68);ctx.moveTo(R*.35,-R*.7);ctx.lineTo(R*.4,R*.68);ctx.stroke();
    poly([[-s*.03,-R*.75],[s*.03,-R*.75],[s*.05,-R*1.15],[0,-R*1.1]],'#6b4a22');poly([[s*.04,-R*.8],[s*.26,-R*1.05],[s*.18,-R*.65]],'#4fae40');
  }
  ctx.restore();
}

function frame(now){
  requestAnimationFrame(frame);if(!G||!lay.ts)return;
  ctx.clearRect(0,0,W,H);
  const hinting=now<hintUntil,{ts,dep,g,ox,oy}=lay,tf=state==='flowing'?(now-flowT0)/1000*flowSpeed:state==='result'?1e9:-1;
  if(state==='flowing'&&tf>maxD+3)finish();
  // planter box
  const pad=ts*.16;rr(ox-pad,oy-pad+dep,G.c*ts+pad*2,G.r*ts+pad*2,ts*.2);ctx.fillStyle='#7a5430';ctx.fill();
  rr(ox-pad,oy-pad,G.c*ts+pad*2,G.r*ts+pad*2,ts*.2);ctx.fillStyle='#b98550';ctx.fill();
  rr(ox-pad*.45,oy-pad*.45,G.c*ts+pad*.9,G.r*ts+pad*.9,ts*.12);ctx.fillStyle='#3d2817';ctx.fill();
  const wf=i=>dist&&isFinite(dist[i])?clamp(tf-dist[i]):0;
  const gw=ts*.17;
  for(let i=0;i<G.N;i++){
    const[cx,cy,x,y,th]=center(i),S=SOIL[G.soil[i]],tw=ts-2*g;
    rr(x+g,y+g+dep,tw,th,ts*.13);ctx.fillStyle=S.side;ctx.fill();
    rr(x+g,y+g,tw,th,ts*.13);ctx.fillStyle=S.top;ctx.fill();
    ctx.fillStyle=S.speck;G.specks[i].forEach(([a,b,r])=>{ctx.beginPath();ctx.arc(x+g+a*tw,y+g+b*th,r*ts,0,7);ctx.fill()});
    const ra=-(Math.PI/2)*(1-easeBack(clamp((now-rotT[i])/190))),damp=state==='edit'&&(cues.damp||hinting)&&isFinite(conn[i]),gc=damp?S.wet:S.groove;
    const ends=DIRS.map(([dx,dy,b])=>G.holes[i]&b?[dx*(tw/2),dy*(th/2)]:null);
    ctx.save();ctx.translate(cx,cy);ctx.rotate(ra);
    ctx.lineCap='round';ctx.strokeStyle=gc;ctx.lineWidth=gw;
    ends.forEach(e=>{if(e){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(...e);ctx.stroke()}});
    if(G.holes[i]){ctx.fillStyle=gc;ctx.beginPath();ctx.arc(0,0,gw*.62,0,7);ctx.fill()}
    if(damp){ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=gw*.16;ends.forEach(e=>{if(e){ctx.beginPath();ctx.moveTo(gw*.12,-gw*.12);ctx.lineTo(e[0]*.85+gw*.12,e[1]*.85-gw*.12);ctx.stroke()}})}
    const f=wf(i);
    if(f>0){ctx.strokeStyle='#4fb8ec';ctx.lineWidth=gw*.62;ends.forEach(e=>{if(e){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(e[0]*f,e[1]*f);ctx.stroke()}});
      ctx.fillStyle='#4fb8ec';ctx.beginPath();ctx.arc(0,0,gw*.42,0,7);ctx.fill();
      if(f<1){ctx.fillStyle='#e4f7ff';ends.forEach(e=>{if(e){ctx.beginPath();ctx.arc(e[0]*f,e[1]*f,gw*.36,0,7);ctx.fill()}})}}
    ctx.restore();
  }
  // aqueduct bridges between connected tiles
  for(let i=0;i<G.N;i++)for(const[j,b]of G.nb(i)){if(j<i||!(G.holes[i]&b&&G.holes[j]&OPP[b])||now-rotT[i]<190||now-rotT[j]<190)continue;
    const[ax,ay]=center(i),[bx,by]=center(j),v=b===4,S=SOIL[G.soil[i]];
    const x1=v?ax:ax+(ts/2-g),y1=v?ay+(ts-dep-2*g)/2:ay,x2=v?bx:bx-(ts/2-g),y2=v?by-(ts-dep-2*g)/2:by;
    const dmp=state==='edit'&&(cues.damp||hinting)&&isFinite(conn[i]);ctx.strokeStyle=dmp?S.wet:S.groove;ctx.lineWidth=gw;ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    const wet=wf(i)>=1&&wf(j)>0||wf(j)>=1&&wf(i)>0;
    if(wet){ctx.strokeStyle='#4fb8ec';ctx.lineWidth=gw*.62;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}}
  // joint clicks
  joints=joints.filter(q=>now-q.t0<480);joints.forEach(q=>{const a=(now-q.t0)/480;if(a<0)return;
    const[ax,ay]=center(q.i),[bx,by]=center(q.j),mx=(ax+bx)/2,my=(ay+by)/2;
    ctx.strokeStyle=`rgba(255,246,214,${1-a})`;ctx.lineWidth=3*(1-a)+1;ctx.beginPath();ctx.arc(mx,my,gw*(.5+1.7*easeBack(Math.min(1,a*1.6))),0,7);ctx.stroke();
    ctx.fillStyle=`rgba(255,246,214,${1-a})`;for(let n=0;n<4;n++){const an=n*1.5708+.785,r=gw*(.8+2.4*a);ctx.beginPath();ctx.arc(mx+Math.cos(an)*r,my+Math.sin(an)*r,2.2*(1-a)+.6,0,7);ctx.fill()}});
  // picky overlay
  if(drag)for(let i=0;i<G.N;i++)if(G.soil[i]!==PL[drag.kind].soil||occ[i]&&!drag.cells.includes(i)){const[,,x,y,th]=center(i);rr(x+g,y+g,ts-2*g,th,ts*.13);ctx.fillStyle='rgba(25,18,8,.38)';ctx.fill()}
  if(flash&&now-flash.t<450){const[,,x,y,th]=center(flash.i);rr(x+g,y+g,ts-2*g,th,ts*.13);ctx.fillStyle=`rgba(230,60,40,${.5*(1-(now-flash.t)/450)})`;ctx.fill()}
  // springs
  occ.forEach((o,i)=>{if(!o||o.type!=='water')return;const[cx,cy]=center(i);
    ctx.fillStyle='#8a8f96';ctx.beginPath();ctx.ellipse(cx,cy+ts*.04,ts*.31,ts*.25,0,0,7);ctx.fill();
    ctx.fillStyle='#2f8fc4';ctx.beginPath();ctx.ellipse(cx,cy+ts*.02,ts*.25,ts*.19,0,0,7);ctx.fill();
    ctx.fillStyle='#55bdf0';ctx.beginPath();ctx.ellipse(cx,cy,ts*.21,ts*.15,0,0,7);ctx.fill();
    const burstOn=state==='flowing'&&now<flowT0,ph=(now/(burstOn?300:1400))%1;ctx.strokeStyle=`rgba(255,255,255,${.7*(1-ph)})`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(cx,cy,ts*.2*ph+2,ts*.14*ph+1.5,0,0,7);ctx.stroke()});
  // beds + plants
  plants.forEach(p=>{const set=new Set(p.cells);ctx.strokeStyle=PL[p.kind].acc;ctx.lineWidth=Math.max(2.5,ts*.045);ctx.lineCap='round';
    p.cells.forEach(i=>{const[,,x,y,th]=center(i),inset=g+ts*.05,L=x+inset,T=y+inset,R=x+ts-inset,B=y+g+th-ts*.05+g*0;
      G.nb(i).length;DIRS.forEach(([dx,dy],d)=>{const nx=i%G.c+dx,ny=((i/G.c)|0)+dy,j=ny*G.c+nx;
        if(nx>=0&&ny>=0&&nx<G.c&&ny<G.r&&set.has(j))return;ctx.beginPath();
        if(d===0){ctx.moveTo(L,T);ctx.lineTo(R,T)}else if(d===1){ctx.moveTo(R,T);ctx.lineTo(R,B)}else if(d===2){ctx.moveTo(L,B);ctx.lineTo(R,B)}else{ctx.moveTo(L,T);ctx.lineTo(L,B)}ctx.stroke()})});
    const dry=state==='result'&&!isFinite(p.d),sh=dry&&now<shakeUntil?Math.sin(now/30)*ts*.04:0;
    const mood=state==='edit'&&(cues.sprout||hinting)?(p.cells.some(k=>isFinite(conn[k]))?'awake':'sleepy'):null;
    if(state==='flowing'&&isFinite(p.d)&&tf>=p.d&&!splashed.has(p.id)){splashed.add(p.id);sfx(420+splashed.size*70,.12,.18);
      p.cells.forEach(k=>{const[x,y]=center(k);for(let n=0;n<9;n++)parts.push({x,y,vx:(Math.random()-.5)*3,vy:-1.5-Math.random()*2.5,life:.8,col:n%2?'#55bdf0':'#c8efff',drop:1})})}
    p.cells.forEach(i=>{const[cx,cy]=center(i);const k=isFinite(p.d)&&tf>=p.d?easeBack(clamp((tf-p.d)/1.4)):0;
      if(k>0)drawPlant(p.kind,cx,cy,ts,Math.max(.15,k));else drawSprout(cx,cy,ts,dry,sh,mood,now)})});
  // drag preview
  if(drag){const p=PL[drag.kind];drag.cells.forEach(i=>{const[cx,cy,x,y,th]=center(i);rr(x+g,y+g,ts-2*g,th,ts*.13);ctx.fillStyle='rgba(255,255,255,.25)';ctx.fill();ctx.strokeStyle=p.acc;ctx.lineWidth=3;ctx.stroke();drawSprout(cx,cy,ts,false,0)});
    const[cx,cy]=center(drag.cells.at(-1)),t=`${drag.cells.length}/${p.size}`;ctx.font=`600 ${Math.max(14,ts*.22)}px Fredoka,sans-serif`;
    const w=ctx.measureText(t).width+16;rr(cx-w/2,cy-ts*.62,w,ts*.3,10);ctx.fillStyle='#fff8ea';ctx.fill();ctx.fillStyle='#22361a';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,cx,cy-ts*.47)}
  // particles
  parts=parts.filter(q=>(q.life-=.012)>0);parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.06;ctx.globalAlpha=Math.min(1,q.life*1.4);if(q.drop){ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,3.2,0,7);ctx.fill()}else poly([[q.x,q.y-5],[q.x+4,q.y],[q.x,q.y+5],[q.x-4,q.y]],q.col)});ctx.globalAlpha=1;
}
load(lvlIdx);requestAnimationFrame(frame);
}
</script>
