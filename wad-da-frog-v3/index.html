<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wad da Frog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, swampy, toy-like
   IDEA: a pond diorama, tilted view; kayak in front, lily pads at the far edge
   PICTURE: the playable swamp itself fills the screen
   COLOUR and TYPE: deep pond green, lily green, orange kayak, frog red accent; Mitr
   LAYOUT: one full-height canvas, centered, letterboxed in pond colour */
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0c231d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
{
const W=360,H=640;
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const FONT='Boogaloo, system-ui, sans-serif';
try{document.fonts.load('40px Boogaloo')}catch(e){}   // canvas text needs the web font fetched up front
const spriteCache=new Map();let newSprites=0;let bgCache=null,shadowGrad=null,vigGrad=null;
let PX=1;   // canvas pixels per game unit
function resize(){
  const s=Math.min(innerWidth/W,innerHeight/H),d=Math.min(2,window.devicePixelRatio||1);PX=s*d;spriteCache.clear();bgCache=null;
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';
  cv.width=Math.round(W*s*d);cv.height=Math.round(H*s*d);
  ctx.setTransform(s*d,0,0,s*d,0,0);
}
addEventListener('resize',resize);resize();

// ---------- tuning ----------
const TIERS=[{r:10,w:1},{r:14,w:1.5},{r:17,w:2.2},{r:21,w:3},{r:34,w:4}];
const TEEN=3,GIANT=4,GR=34;
const SPECIES={normal:{c:'#74c94f',d:'#3f8a2c',name:'Green'},blue:{c:'#4fa8e6',d:'#24639a',name:'Blue!'},red:{c:'#e8553f',d:'#9c2a1e',name:'Red!'}};
const RED_CHANCE=0.35;
const T_BOARD=5, T_ROWS=8;    // kayak can't sink before T_BOARD / lily rows start
const RAMP=15;             // seconds from T_BOARD to full difficulty
const diff=()=>tut?0:clamp((t-T_BOARD)/RAMP,0,1);
const lerp=(a,b,k)=>a+(b-a)*k;
const BLUE_CHANCE=.3;
const speciesRoll=()=>{const c=SEG(seg),r=Math.random();return r<c.red?'red':r<c.red+c.blue?'blue':'normal'};
const BLAST_R=110;         // two blue giants' explosion radius
// layout: lily strip ~10% | swamp ~58% | kayak ~32%
const TOP=66, SWAMP_BOTTOM=378;
const KY=61.6, KS=1.35, KB=680;   // kayak art is drawn in its own coordinates, shifted down by KY and scaled by KS about y=KB
const K=(x,y)=>[180+(x-180)*KS,KB-(KB-(y+KY))*KS];   // kayak coords -> screen
const BOW_X=180, NEXT_Y=520, LAUNCH_Y=498;   // + KY on screen
const G=-260;              // buoyancy: things float UP (reverse Suika)
const SAFE_WEIGHT=4;
const DRY_WEIGHT=2.5, SINK_WEIGHT=15.5;  // load at which the kayak starts to sit low / goes under (~11 frogs)
const RED_FLOOD=5.3, FLOOD_DRAIN=.75;   // big but short: ~4 frogs' worth of water, gone in ~7 s      // a red frog's hit lets in water worth ~2 frogs (over ~2 s), draining slowly
const FULL_LEVEL=80, SINK_TIME=6;        // load alone sinks the kayak to 80%; past capacity it goes under over ~6 s       // kayak weight before water starts rising
const ATTACK_TIME=1.2;     // red giant's single leap (longer when it jumps from further away)
const RAID_START=11;            // first red raid: a single slow one to learn the slap
const CALM=2.5;
const MERGE_M=5;            // metres per frog-size step for a merge, before the combo multiplier
const COMBO_STEP=.15, COMBO_CAP=2.5;   // each combo step adds +15% to merge distance, up to x2.5
const SUMMARY_AT=1.7;       // the ending plays this long before the summary comes up
const ENTER=.9;            // new rows ease out from under the lily pads over this long, nudging the swamp down
const STRETCH=.28;         // a thrown frog is stretched along its flight for this long
const PULL=.08;            // matching frogs pull together this long before merging
const STAR_EVERY=2000;      // endless: a star for every 2000 m
const FLY_TIME=1.3;         // a new star pops up mid-screen, then flies into place   // distance for each star; all three clears the level
const LEAP_MIN=.65;         // red frogs never get faster than this share of their normal leap time
const BOARD_MIN=.28, BOARD_RAMP=140;   // late game: frogs board up to 1/BOARD_MIN times as often             // breather after a big clear: no boarding, raids or new rows       // red frogs start raiding on their own after this many seconds
const CHARGE=.4;           // giants crouch this long before jumping
const PADS=[36,108,180,252,324], PAD_Y=30;
// waiting frogs line up around the seat, from the lower right, over the front, down the left.
// Bigger frogs take more of the ring; a full ring is about when the kayak goes under.
const RING={rx:66,ry:54,a0:-.27,sweep:Math.PI-.54};   // only the part of the ring that is on screen
const RING_CAP=13.5;   // load (frog weight) that fills the ring
const SIDE_X=275,SIDE_Y=560;    // frogs hop aboard from the water on the right
const HL=[[81,648],[84,576],[146,504],[180,478]],HR=[[279,648],[276,576],[214,504],[180,478]];
const CK={x:180,y:592,rx:42,ry:46};   // cockpit; its rim is where the two waters meet
// ---------- endless run ----------
// Paddle through the swamp screen by screen: throw frogs to clear the channel ahead (a grown frog acts
// the moment it forms: green hops away with its neighbours, blue blows up, red comes for the kayak).
// Frogs keep climbing aboard (ammo is endless, but they are weight): overload = sink, 3 red hits = sink.
// Every few screens a shallow bank: chest + shop, coins from frogs cleared. Items ride in the cockpit (max 3).
const LANE_W=124;         // width of the channel that has to be cleared
const MAX_HITS=3;
const MOVE_TIME=1.7,MOVE_DIST=430;   // paddling on to the next screen
const FLEE_R=40;          // a green frog hopping away takes the frogs this close along with it
const TEEN_BLAST=66;      // a blue frog's blast radius
const CAP=25;             // weight that sinks the kayak (gauge = 100%)
const START_LOAD=.25;     // each stretch starts with eggs/tadpoles aboard up to this share of CAP
const ITEM_MAX=3;
const RAINBOW_TIME=2.2;   // rainbow: frogs merge on a near-touch for this long
const BOMB_R=130;
const MISS_BUMP=.35;      // a thrown frog that bumps into a frog it can't merge with swims back aboard this long after (unless it merges first)
const segLen=k=>Math.min(420,200+k*40);   // metres between banks, longer each stretch
const ROW_GAP=k=>Math.max(2,3.6-k*.25);   // a new row flows in from under the lily pads this often
const PACE=(open)=>1.5+8.5*open*open;           // m/s: the more open water ahead, the faster the kayak goes
const JET_TIME=6;
// how a stretch plays, harder each time
const SEG=k=>({rows:3,pile:k<1?[.15,.55,1]:[.08,.4,1],board:Math.max(1.2,2.2-k*.12),
  boardTiers:k<1?[.2,.6,1]:[.1,.45,1],blue:.3,red:k<1?0:Math.min(.35,.12+k*.06)});
const ITEMS={
  jet:{icon:'🚀',name:'Jet',desc:'6s full speed, no new rows'},
  bomb:{icon:'💣',name:'Big bomb',desc:'Next throw blows up a third of the swamp'},
  rainbow:{icon:'🌈',name:'Rainbow',desc:'Wakes the swamp: matching frogs merge in a chain'},
  bucket:{icon:'🪣',name:'Bucket',desc:'Dumps the kayak down to 25%'},
};
const ITEM_KEYS=Object.keys(ITEMS);
let seg=0,screen=0,hits=0,coins=0,moveT=0,oldPile=[],newPile=[],shoreT=-1,laneT=0,loseKind='',thrownOnce=false,laneGlow=0,screensDone=0,
  boatItems=[],nextBomb=false,nextRainbow=false,nets=0,jetNext=false,shop=[],chest=null,piggy=0,piggyShown=0,runBest=0,gaugePulse=0,coinPop=0,leaveT=0,isFirstBank=true,rainbowT=0,poorT=0,meters=0,segM=0,jetT=0,pace=0;
try{boatItems=JSON.parse(localStorage.getItem('wadItems')||'[]').filter(k=>ITEMS[k]).slice(0,ITEM_MAX)}catch(e){boatItems=[]}
try{piggy=+localStorage.getItem('wadPiggy')||0;runBest=+localStorage.getItem('wadBestM')||0}catch(e){}
function saveRun(){try{localStorage.setItem('wadItems',JSON.stringify(boatItems));localStorage.setItem('wadPiggy',piggy);localStorage.setItem('wadBestM',runBest)}catch(e){}}

// ---------- state ----------
let state='start',overAt=0,nextRow=null,reedWarn=0;
let items,raft,parts,texts,attackers,leavers,swimmers,blasts=[];
let maxCombo=0,bestCombo=0,newBestCombo=false,endT0=0,newBest=false,endFx={popped:[]},jumpers=[],escapers=[],mouthT=0,throwSeq=0,throws={},comboPulse=0,rings=[],playTime=0,starsGot=0,flyers=[],winAt=0,calmT=0,flood=0,floodIn=0,raidT=0,raids=0,hitStop=0,ptr=null,scroll,level,dist,t,spawnT,shake,combo,lastMerge,speed,rowT,rowMax,cool,slosh,vl=0,rate=0,pan=0,holdT=0,holdCD=0;
let best=0;try{best=+localStorage.getItem('frogRaftBest')||0}catch(e){}
let bestComboSaved=0;try{bestComboSaved=+localStorage.getItem('frogRaftCombo')||0}catch(e){}

function reset(){
  items=[];raft=[];parts=[];texts=[];attackers=[];leavers=[];swimmers=[];blasts=[];
  level=0;calmT=0;maxCombo=0;throwSeq=0;throws={};comboPulse=0;rings=[];starsGot=0;flyers=[];flood=0;floodIn=0;raidT=0;raids=0;hitStop=0;slosh=0;scroll=0;rate=0;pan=0;dist=0;t=0;spawnT=1.2;shake=0;combo=0;lastMerge=-9;speed=1;rowT=rowMax=6;cool=0;holdT=0;holdCD=0;
  nextRow=[];
}
function ringPoint(f){const a=RING.a0-Math.min(f,1.04)*RING.sweep;return K(CK.x+Math.cos(a)*RING.rx,CK.y+Math.sin(a)*RING.ry)}
function slots(){const out=[K(BOW_X,NEXT_Y)];let s=0;
  for(let i=1;i<raft.length;i++){const w=TIERS[raft[i].tier].w;out.push(ringPoint((s+w/2)/CAP));s+=w}return out}
function slot(i){return slots()[i]||K(BOW_X,NEXT_Y)}
function board(tier,sp,x,y,front){const f={tier,sp,px:x,py:y,d:99};front?raft.unshift(f):raft.push(f)}
// frogs heading for the kayak dive and swim upstream toward it as faint shadows
function dive(tier,sp,x,y,full){swimmers.push({tier,sp,full,sx:x,sy:y,x,y,t:-.35,dur:1.3+Math.random()*.5})}
function rollTier(){const r=Math.random(),c=SEG(seg).pile;return r<c[0]?0:r<c[1]?1:2}   // the swamp never holds grown frogs: they act the moment they form
function newFrog(){const tier=rollTier();return[tier,tier===TEEN?speciesRoll():null]}
// frogs boarding the kayak skew heavier, so there are fewer throws for the same pressure
function boardFrog(){
  // about a third of the frogs climbing aboard match something in the channel, so it never stalls for long
  const lane=items.filter(b=>!b.dead&&!b.charge&&!b.thrown&&b.tier<TEEN&&inLane(b));
  if(lane.length&&Math.random()<.35)return[lane[Math.floor(Math.random()*lane.length)].tier,null];
  const r=Math.random(),c=SEG(seg).boardTiers;return[r<c[0]?0:r<c[1]?1:2,null]}
// two frogs that would react the moment they touch (merge, or egg gets eaten)
const clash=(a,as,b,bs)=>(a===b&&(a<TEEN||as===bs))||(a===0&&b===TEEN)||(a===TEEN&&b===0);
function genRow(first){
  const row=[];let x=0;
  while(true){let tier,sp,n=0,prev=row[row.length-1];
    // new rows never put two reacting frogs side by side
    do{tier=rollTier();sp=tier===TEEN?speciesRoll():null}while(prev&&clash(prev.tier,prev.sp,tier,sp)&&++n<12);
    const r=TIERS[tier].r;
    if(x+2*r>W)break;row.push({tier,sp,cx:x+r,r});x+=2*r+1}
  const off=(W-x)/2;for(const q of row)q.cx+=off;return row}
// the swamp starts full, packed so that no two touching frogs would react
function startPile(rows){
  let y=TOP;
  for(let k=0;k<rows;k++){let x=0,h=0;const ox=k%2?8:0;
    while(true){let tier,sp,r,cy,n=0;
      do{tier=k===rows-1||Math.random()<.92?rollTier():TEEN;sp=tier===TEEN?speciesRoll():null;r=TIERS[tier].r;cy=y+r}
      while(++n<25&&items.some(o=>Math.hypot(o.x-(ox+x+r),o.y-cy)<o.r+r+16&&clash(o.tier,o.sp,tier,sp)));
      if(ox+x+2*r>W)break;items.push(mk(tier,sp,ox+x+r,cy,0,0));x+=2*r+1;h=Math.max(h,2*r)}
    y+=h-4}
}
// let the starting pile float into place (no merging), then swap out any touching pair that would react
function settlePile(){
  const touch=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r+4;
  for(let round=0;round<8;round++){
    for(let s=0;s<160;s++){
      for(const b of items){b.vy+=G/60;b.vx*=.9;b.vy*=.9;b.x+=b.vx/60;b.y+=b.vy/60;
        if(b.x<b.r)b.x=b.r;if(b.x>W-b.r)b.x=W-b.r;if(b.y<TOP+b.r){b.y=TOP+b.r;b.vy=0}}
      for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i],b=items[j];
        let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01;const m=a.r+b.r;if(d>=m)continue;
        const o=(m-d)/2;a.x-=dx/d*o;a.y-=dy/d*o;b.x+=dx/d*o;b.y+=dy/d*o}}
    let bad=0;
    for(const a of items){
      if(!items.some(o=>o!==a&&touch(a,o)&&clash(o.tier,o.sp,a.tier,a.sp)))continue;
      bad++;
      for(const tier of[0,1,2,3].sort(()=>Math.random()-.5)){
        const sp=tier===TEEN?speciesRoll():null;
        if(!items.some(o=>o!==a&&touch(a,o)&&clash(o.tier,o.sp,tier,sp))){a.tier=tier;a.sp=sp;a.r=TIERS[tier].r;break}}}
    if(!bad)break;
  }
  // anything still clashing is simply left out
  for(const a of items)if(!a.dead&&items.some(o=>o!==a&&!o.dead&&touch(a,o)&&clash(o.tier,o.sp,a.tier,a.sp)))a.dead=true;
  items=items.filter(b=>!b.dead);
  for(const b of items){b.vx=b.vy=0;b.born=-5;b.calm=true}   // the starting pile never reacts with itself
}
// push the waiting row (previewed under the lily pads) into the swamp
function addRow(first,quiet){
  const row=nextRow,h=row.reduce((m,q)=>Math.max(m,q.r),0)*2,smooth=!first&&!quiet;
  if(!first&&quiet)for(const b of items)b.y+=h;
  const fresh=[];
  for(const q of row){const y=TOP+q.r;let n=0;
    // don't drop a frog right onto one it would react with (the swamp should fill up, not melt)
    while(n++<12&&(items.some(o=>Math.hypot(o.x-q.cx,o.y-y)<o.r+q.r+12&&clash(o.tier,o.sp,q.tier,q.sp))||
      fresh.some(o=>Math.abs(o.x-q.cx)<o.r+q.r+3&&clash(o.tier,o.sp,q.tier,q.sp)))){
      q.tier=rollTier();q.sp=q.tier===TEEN?speciesRoll():null;q.r=Math.min(TIERS[q.tier].r,q.r)}
    const b=mk(q.tier,q.sp,q.cx,smooth?TOP-q.r*.7:y,0,0);b.calm=true;if(smooth){b.enter=ENTER;b.ty=y;b.pop=0}fresh.push(b)}   // new rows never react on their own: only your throws set them off
  items.push(...fresh);
  nextRow=genRow(false);
}
function mk(tier,sp,x,y,vx,vy){return{tier,sp,x,y,vx,vy,r:TIERS[tier].r,low:0,born:t,pop:.25,dead:false,wob:Math.random()*6,surf:0}}
function start(){newRun()}
// a run starts on the first bank, with the shop open; coins saved in the piggy bank come along
function newRun(){reset();seg=0;screen=0;hits=0;coins=0;screensDone=0;meters=0;jetT=0;loseKind='';jumpers=[];escapers=[];nextBomb=nextRainbow=false;nets=0;jetNext=false;
  piggyShown=piggy;coins=piggy;piggy=0;saveRun();isFirstBank=true;enterBank(true)}
function enterBank(first){state='bank';shoreT=1;items=[];attackers=[];chest=first?null:{open:false,t:0,item:ITEM_KEYS[Math.floor(Math.random()*ITEM_KEYS.length)]};
  const pool=[...ITEM_KEYS].sort(()=>Math.random()-.5);
  shop=[0,1,2].map(i=>{const k=pool[i];return{k,price:15+Math.floor(Math.random()*8)*5,sold:false,x:72+i*108,y:132}});
  // the frogs aboard hop off onto the bank: the kayak rests empty
  jumpers=raft.map(it=>({x:it.px,y:it.py,tier:it.tier,sp:it.sp,vx:(it.px-180)*1.6+(Math.random()-.5)*60,vy:-380-Math.random()*120,rot:0,spin:(Math.random()-.5)*8}));raft=[];
  hits=0;level=0;if(!first){fanfareSound()}}
// leave the bank: a fresh stretch, eggs and tadpoles aboard up to START_LOAD
function leaveBank(){state='play';shoreT=-1;screen=0;laneT=0;thrownOnce=thrownOnce||seg>0;
  startPile(SEG(seg).rows);settlePile();for(const b of items){b.ty=b.y;b.y-=70;b.enter=ENTER;b.pop=0}
  raft=[];let w=0;while(w<CAP*START_LOAD){const tier=Math.random()<.55?0:1;w+=TIERS[tier].w;raft.push({tier,sp:null,px:0,py:0,d:0})}
  raft.forEach((it,k)=>{const[x,y]=slot(k);it.px=x;it.py=y});spawnT=SEG(seg).board;
  segM=0;nextRow=genRow(false);rowT=rowMax=ROW_GAP(seg)+2;jetT=0;
  if(jetNext){jetNext=false;jetT=JET_TIME}}
const inLane=b=>Math.abs(b.x-180)<LANE_W/2+b.r*.4;
// channel clear -> paddle on; the leftovers drift past, the next screen's frogs come into view (or the bank)
function advance(){
  const toBank=true;
  moveT=MOVE_TIME;oldPile=items.filter(b=>!b.dead);for(const b of oldPile){b.oy=b.y;b.vx=b.vy=0}
  items=[];newPile=[];
  if(!toBank){startPile(SEG(seg).rows);settlePile();newPile=items;for(const b of newPile){b.ty=b.y;b.y=b.ty-MOVE_DIST}}
  items=[...oldPile,...newPile];screen++;screensDone++;if(toBank)shoreT=0;
  tone(523,.12,'triangle',.12);setTimeout(()=>tone(784,.18,'triangle',.12),110);whooshSound()}
function moveStep(dt){
  moveT-=dt;const k=1-Math.max(0,moveT)/MOVE_TIME,e=k*k*(3-2*k);
  for(const b of oldPile){b.y=b.oy+MOVE_DIST*e;b.fade=1-e}
  for(const b of newPile)b.y=b.ty-MOVE_DIST*(1-e);
  if(shoreT>=0)shoreT=e;
  scroll+=dt*260;speed=7;
  const kk=Math.min(1,dt*9),sl=slots();raft.forEach((it,i)=>{const[tx,ty]=sl[i];it.px+=(tx-it.px)*kk;it.py+=(ty-it.py)*kk;it.d=Math.hypot(tx-it.px,ty-it.py)});
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.life-=dt}parts=parts.filter(p=>p.life>0);
  if(moveT<=0){items=newPile;oldPile=[];newPile=[];speed=1;if(shoreT>=0){seg++;enterBank(false)}}}
// ---------- items ----------
function gainItem(k,x,y){burst(x,y,'#ffe27a',14);tone(880,.1,'triangle',.12);setTimeout(()=>tone(1320,.14,'triangle',.12),80);
  if(boatItems.length<ITEM_MAX){boatItems.push(k);saveRun()}else useItem(k,true)}   // no room aboard: it goes off right away
function useItem(k,overflow){
  tone(660,.08,'square',.06);
  if(k==='jet'){if(state==='play'&&moveT<=0)jetT=JET_TIME;else jetNext=true}
  else if(k==='bomb')nextBomb=true;
  else if(k==='rainbow'){rainbowT=RAINBOW_TIME;shake=Math.max(shake,.2);
    for(const b of items){b.calm=false;if(b.tier<TEEN&&!b.dead){b.pop=.25;burst(b.x,b.y,['#ff7a7a','#ffd34a','#8fe388','#7ac8ff','#c79bff'][b.tier%5],4)}}
    tone(523,.12,'triangle',.12);setTimeout(()=>tone(659,.12,'triangle',.12),90);setTimeout(()=>tone(784,.12,'triangle',.12),180);setTimeout(()=>tone(1046,.2,'triangle',.12),270)}
  else if(k==='bucket'){shake=Math.max(shake,.25);let w=raft.reduce((a,i)=>a+TIERS[i.tier].w,0);
    while(raft.length&&w>CAP*START_LOAD){const it=raft.pop();w-=TIERS[it.tier].w;
      jumpers.push({x:it.px,y:it.py,tier:it.tier,sp:it.sp,vx:(it.px-180)*2.4+(Math.random()-.5)*120,vy:-340-Math.random()*160,rot:0,spin:(Math.random()-.5)*10})}
    whooshSound();tone(220,.3,'sine',.18,.4)}
  if(k==='jet')shake=Math.max(shake,.2);
  const[x,y]=K(180,560);texts.push({x,y:y-40,s:ITEMS[k].icon+' '+ITEMS[k].name+(overflow?'!':''),c:'#ffe27a',size:18,life:1.4})}
const SELL=10;
const ITEM_SPOTS=[[150,616],[180,606],[210,616]];
const itemAt=p=>ITEM_SPOTS.findIndex(([x,y],i)=>i<boatItems.length&&Math.hypot(p.x-x,p.y-y)<22);
// ---------- title: an empty swamp, one green frog on the bow; tap and it leaps in, then the game starts ----------
let intro=null;
function startScene(){reset();items=[];raft=[];const[x,y]=slot(0);raft.push({tier:TEEN,sp:'normal',px:x,py:y,d:0});state='start'}
function beginIntro(tutorial){const f=raft.shift();intro={x0:f.px,y0:f.py,x:f.px,y:f.py,t:0,tut:tutorial,splash:false};state='intro'}
const INTRO_JUMP=.55,INTRO_END=1.25;
function introUpdate(dt){const it=intro;it.t+=dt;const p=Math.min(1,it.t/INTRO_JUMP),tx=180,ty=430;

function startTutorial(){

function tutStep(n){tut=n;tutT=0;tutNext=0;tutFade=0;

  if(n===3){tutPhase='fill';tutSpawnT=.3;tutPeak=0}   // fill: watch it sink once · sunk: frogs bail, kayak refloats · try: your turn

    if(raft[0])raft[0].tier=0;tutEater=null;tutEatPhase='feed'}

function tutUpdate(dt){

  if(tut===1&&!raft.length&&!items.some(b=>b.thrown))board(0,null,...K(SIDE_X,SIDE_Y));
  if(tut===2){
    if(!tutTarget()){const b=mk(tutNeed,null,180,TOP+80,0,0);b.pop=.25;items.push(b);burst(180,TOP+80,'#cfe9ff',8)}
    if(!raft.length)board(tutNeed,null,...K(SIDE_X,SIDE_Y));
    else if(raft[0].tier!==tutNeed)raft[0].tier=tutNeed}
  if(tut===3){
    if(tutPhase==='sunk'){tutSunkT+=dt;
      tutDip=tutSunkT<.5?tutSunkT/.5:tutSunkT<1.7?1:Math.max(0,1-(tutSunkT-1.7)/.6);
      for(const j of jumpers){j.vy+=700*dt;j.x+=j.vx*dt;j.y+=j.vy*dt;j.rot+=j.spin*dt}
      if(tutSunkT>=2.4){tutPhase='try';tutDip=0;jumpers=[];tutPeak=0;tutT=0;tutFade=0;tutSpawnT=.3;board(0,null,...K(SIDE_X,SIDE_Y))}
      return}

    if(tutPhase==='try'){tutPeak=Math.max(tutPeak,curLoad);

}

// ---------- merging ----------
function canMerge(a,b){return (a.tier===b.tier||((a.rainbow||b.rainbow)&&a.tier<TEEN&&b.tier<TEEN))&&!a.charge&&!b.charge&&!a.pull&&!b.pull&&(a.tier<TEEN||a.sp===b.sp)&&!(a.tier===GIANT&&a.sp==='red')}
function merge(a,b){
  if(a.tier===GIANT){ // a matching pair: both crouch, then go together
    a.charge=b.charge=CHARGE;a.pair=b;b.pair=a;a.lead=true;a.vx=b.vx=a.vy=b.vy=0;
    popSound(GIANT,landed(a.tid||b.tid));
    say((a.x+b.x)/2,(a.y+b.y)/2-50,a.sp==='blue'?'คู่ฟ้า! เตรียมระเบิด':'คู่เขียว! ไปด้วยกัน',SPECIES[a.sp].c,17);
    return}
  a.dead=b.dead=true;
  const tier=Math.max(a.tier,b.tier)+1,x=(a.x+b.x)/2,y=(a.y+b.y)/2;
  let sp=a.sp;
  if(tier===TEEN)sp=speciesRoll();
  const tid=a.tid||b.tid,step=landed(tid);lastMerge=t;tutMerged(tier);
  coins+=1;coinPop=.3;   // every merge takes a frog out of the swamp
  burst(x,y,tier>=TEEN?SPECIES[sp].c:'#cfe9ff',10+tier*4);
  // feel: a pop that climbs, a ripple that nudges the neighbours, weight for the big ones
  popSound(tier,step);
  // only grown frogs (teen and giant) get the ripple, the nudge and a light shake
  if(tier>=TEEN){
    for(const o of items){if(o.dead)continue;const dx=o.x-x,dy=o.y-y,d=Math.hypot(dx,dy)||1;
      if(d<TIERS[tier].r*3.2){const f=(1-d/(TIERS[tier].r*3.2))*(70+tier*25);o.vx+=dx/d*f;o.vy+=dy/d*f}}
  }
  if(tier===GIANT){const g=mk(GIANT,sp,x,y,0,0);g.tid=tid;g.jelly=.45;g.pop=0;
    g.charge=CHARGE;
    items.push(g);return}
  const nb=mk(tier,sp,x,y,(a.vx+b.vx)/2,(a.vy+b.vy)/2);nb.act=.8;nb.tid=tid;nb.jelly=.45;nb.pop=0;items.push(nb);
  if(tier===TEEN){nb.charge=CHARGE;nb.vx=nb.vy=0}   // grown: it crouches, then acts (hop away / blow up / come for you)
  if(tier===TEEN)say(x,y-28,SPECIES[sp].name,SPECIES[sp].c,15);
}

// ---------- update ----------
function update(dt){
  t+=dt;cool-=dt;
  if(moveT>0){moveStep(dt);return}
  const lv0=level;
  const off=kOff();
  // kayak drifts deeper; deeper swamp = more frogs
  const t0=t-dt;
  if(t0<T_BOARD&&t>=T_BOARD)say(W/2,300,'เรือเริ่มจมได้แล้ว! กบบนเรือเยอะ = จม','#ffe27a',17,2.6);
  if(t0<T_ROWS&&t>=T_ROWS)say(W/2,300,'ใบบัวหุบ = กบแถวใหม่ดันลงมา','#c8ff9e',17,2.6);
  speed=1+pace*.55;
  scroll+=(10+pace*12)*dt;
  if(rainbowT>0){rainbowT-=dt;for(const b of items)b.calm=false}
  spawnT-=dt;gaugePulse=Math.max(0,gaugePulse-dt*3);coinPop=Math.max(0,coinPop-dt);
  if(spawnT<=0){spawnT=SEG(seg).board*(.75+Math.random()*.5);gaugePulse=1;
    board(...boardFrog(),...K(SIDE_X,SIDE_Y));burst(...K(SIDE_X,SIDE_Y),'rgba(200,240,255,.8)',7)}
  for(const w of swimmers){w.t+=dt;if(w.t<0)continue;
    const[tx,ty]=w.full?K(BOW_X,NEXT_Y-56):K(SIDE_X-10,SIDE_Y-24);
    const p=Math.min(1,w.t/w.dur),e=p*p*(3-2*p);
    w.x=w.sx+(tx-w.sx)*e+Math.sin(w.t*6)*6*(1-p);w.y=w.sy+(ty-w.sy)*e;
    if(p>=1){w.done=true;board(w.tier,w.sp,w.x,w.y,w.full);burst(w.x,w.y,'rgba(200,240,255,.8)',7);
      if(w.full)say(BOW_X,NEXT_Y-40+off,'แซงคิว!','#ffd34a',15)}}
  swimmers=swimmers.filter(w=>!w.done);

  // frogs on the kayak hop to their place in line (front one to the bow)
  const kk=Math.min(1,dt*9);
  const sl=slots();raft.forEach((it,i)=>{const[tx,ty]=sl[i];it.px+=(tx-it.px)*kk;it.py+=(ty-it.py)*kk;it.d=Math.hypot(tx-it.px,ty-it.py)});
  // water slopping over the rim once the kayak sits low
  if(vl>.15){slosh-=dt;if(slosh<=0){slosh=.5-vl*.35+Math.random()*.2;
    const left=Math.random()<.5,[x,y]=K(...bez(left?HL:HR,.15+Math.random()*.7));
    for(let i=0;i<5;i++)parts.push({x,y,vx:(left?1:-1)*(30+Math.random()*70),vy:-40-Math.random()*70,r:1.5+Math.random()*2,c:'rgba(200,240,255,.85)',life:.5})}}
  // grown frogs open their mouths when an egg is near
  const eggNext=raft[0]&&raft[0].tier===0;
  mouthT-=dt;const recheck=mouthT<=0;if(recheck)mouthT=.12;
  for(const b of items)if(b.tier===TEEN){
    if(recheck){b.near=eggNext;if(!b.near)for(const e of items)if(e.tier===0&&Math.hypot(e.x-b.x,e.y-b.y)<b.r+e.r+70){b.near=true;break}}
    const near=b.near;
    if(b.gulp>0)b.gulp-=dt;
    const tg=b.gulp>0?0:near?1:0;b.mo=(b.mo||0)+(tg-(b.mo||0))*Math.min(1,dt*10)}
  // lily pads open in 3 stages, then a new row pushes in from the top
  calmT-=dt;
  // the swamp flows toward the kayak: a new row pushes in from the top every so often (not during a jet)
  if(jetT>0)jetT-=dt;else if(!tut)rowT-=dt;
  if(rowT<=0){rowT=rowMax=ROW_GAP(seg);addRow(false)}

  items=items.filter(b=>!b.dead);
  const damp=Math.exp(-1.6*dt);
  for(const b of items){
    if(b.enter>0){b.enter-=dt;b.y+=(b.ty-b.y)*Math.min(1,dt*4);b.vx=b.vy=0;continue}
    const dm=b.thrown?Math.exp(-.5*dt):b.charge?Math.exp(-8*dt):damp;
    b.vy+=G*dt;b.vx*=dm;b.vy*=dm;b.x+=b.vx*dt;b.y+=b.vy*dt;

      if(b.miss<=0){const th=throws[b.tid];
        if(!th||!th.hit){b.dead=true;window.missN=(window.missN||0)+1;dive(b.tier,b.sp,b.x,b.y);dive(0,null,b.x+(b.x<180?14:-14),b.y+6);   // ...and brings a friend
          gaugePulse=1;burst(b.x,b.y,'#ff9c8a',8);say(b.x,b.y-24,'พลาด! พาเพื่อนกลับมา','#ff9c8a',14);tone(240,.12,'square',.06);setTimeout(()=>tone(180,.16,'square',.06),90)}}}

    if(b.pull){const o=b.pull;
      if(o.dead||o.pull!==b){b.pull=null}
      else{const mx=(b.x+o.x)/2,my=(b.y+o.y)/2,k=Math.min(1,dt*28);b.x+=(mx-b.x)*k;b.y+=(my-b.y)*k;b.vx*=.5;b.vy*=.5;
        b.pullT-=dt;if(b.pullT<=0&&b.lead2){b.lead2=false;b.pull=o.pull=null;merge(b,o)}}}
    if(b.charge){b.charge-=dt;if(b.charge<=0){b.charge=0;b.dead=true;
      if(b.sp==='blue'){if(!b.pair)giant(b.x,b.y,'blue');else if(b.lead)giant((b.x+b.pair.x)/2,(b.y+b.pair.y)/2,'blue')}
      else giant(b.x,b.y,b.sp)}}
    if(b.thrown&&(Math.hypot(b.vx,b.vy)<90||b.y<TOP+b.r+2))b.thrown=false;
    if(b.bomb&&!b.thrown){b.dead=true;bombAt(b.x,b.y)}
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.4}

  }
  for(let k=0;k<3;k++){
    for(let i=0;i<items.length;i++){const a=items[i];if(a.dead)continue;
      for(let j=i+1;j<items.length;j++){const b=items[j];if(b.dead)continue;
        let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);const m=a.r+b.r;
        if(rainbowT>0&&d<m+8&&canMerge(a,b)){a.pull=b;b.pull=a;a.pullT=b.pullT=PULL;a.lead2=true;continue}
        if(d>=m)continue;

        if(((a.tier===0&&a.tid&&b.tier===TEEN)||(b.tier===0&&b.tid&&a.tier===TEEN))){eat(a.tier===TEEN?a:b,a.tier===0?a:b);if(a.dead)break;continue}
        if(a.thrown||b.thrown){const f=a.thrown?a:b,o=f===a?b:a;f.thrown=false;if(f.tid&&!f.bumped&&!o.charge){f.bumped=true;f.miss=MISS_BUMP}}   // hit the wrong frog: it gives up quickly

      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a);ctx.scale(1-.22*e,1+.5*e);ctx.rotate(-a);drawCreature(0,0,b.tier,b.sp,br,t+b.wob,b.rot||0,o);ctx.restore();continue}
    if(b.jelly>0){const k=1-b.jelly/.45,e=(1-k)*(1-k),w=Math.cos(k*Math.PI*3);
      ctx.save();ctx.translate(b.x,b.y);ctx.scale(1+.4*e*w+.15*e,1-.35*e*w+.15*e);drawCreature(0,0,b.tier,b.sp,br,t+b.wob,b.rot||0,o);ctx.restore()}
    else drawCreature(b.x,b.y,b.tier,b.sp,br,t+b.wob,b.rot||0,o,s)}

  ctx.globalAlpha=1;
  // once a grown frog has eaten, it shows how many eggs so far (3 = full)
  for(const b of items)if(b.tier===TEEN&&!b.dead&&!(b.enter>0)&&(b.fat||0)>0&&!(tut===4&&b===tutEater))
    for(let i=0;i<3;i++){ctx.fillStyle=i<(b.fat||0)?'#ffe27a':'rgba(255,255,255,.3)';dot(b.x-12+i*12,b.y-b.r-12,4)}
  for(const bl of blasts){const k=bl.t;if(k<0)continue;
    ctx.fillStyle='rgba('+(bl.c||'180,230,255')+','+(.35*(1-k))+')';dot(bl.x,bl.y,(bl.r||BLAST_R)*(.4+.8*k));
    ctx.strokeStyle='rgba(225,245,255,'+(.9*(1-k))+')';ctx.lineWidth=4*(1-k)+1;ctx.beginPath();ctx.arc(bl.x,bl.y,(bl.r||BLAST_R)*(.3+.9*k),0,Math.PI*2);ctx.stroke()}
  // rainbow: every small frog glows while the swamp is awake
  if(rainbowT>0){ctx.lineWidth=3;const a=Math.min(1,rainbowT/.4);
    for(const b of items){if(b.dead||b.tier>=TEEN)continue;ctx.strokeStyle='hsla('+((t*360+b.x*2+b.y)%360)+',90%,65%,'+(.85*a)+')';ctx.beginPath();ctx.arc(b.x,b.y,b.r+4,0,Math.PI*2);ctx.stroke()}}
  // giants hop away over the lily pads, shrinking into the distance
  for(const l of leavers){const p=l.t;
    ctx.globalAlpha=p>.75?(1-p)/.25:1;
    drawCreature(l.x+(l.tx-l.x)*p,l.y+(-24-l.y)*p-Math.sin(p*Math.PI)*70,l.tier||GIANT,'normal',TIERS[l.tier||GIANT].r,t,0,null,1-.65*p)}
  ctx.globalAlpha=1;
  for(const e of escapers){const p=clamp((e.t-e.d)/.8,0,1);if(p>=1)continue;const r=TIERS[e.tier].r;
    if(p<=0){drawCreature(e.x,e.y,e.tier,e.sp,r,t);continue}
    ctx.globalAlpha=p>.75?(1-p)/.25:1;
    drawCreature(e.x+(e.tx-e.x)*p,e.y+(-24-e.y)*p-Math.sin(p*Math.PI)*60,e.tier,e.sp,r,t,0,null,1-.6*p);ctx.globalAlpha=1}
  const off=kOff();
  drawWake(off);
  ctx.save();
  if(state==='over'&&loseKind==='sunk'){const e=clamp((t-endT0)/1.6,0,1);ctx.translate(0,90*e*e);ctx.globalAlpha=1-.55*e}
  if(tut===3&&tutDip>0){ctx.translate(0,80*tutDip*tutDip);ctx.globalAlpha=1-.5*tutDip}
  if(state==='win'){const e=clamp((t-endT0)/1.6,0,1);ctx.translate(0,-36*e*(2-e))}
  if(pan>0&&state==='play'){const a=Math.sin(t*38)*.035*pan;ctx.translate(Math.sin(t*47)*3*pan,0);ctx.translate(...K(180,600));ctx.rotate(a);ctx.translate(-180,-K(180,600)[1])}
  if(vl>0){const ss=1-.07*vl;ctx.translate(...K(180,600));ctx.scale(ss,ss);ctx.translate(-180,-K(180,600)[1])}   // going under = a little further from the camera
  const bob=drawKayak(off);
  drawQueue(bob,off);
  drawSunk(bob);
  if(state==='play'||state==='bank')drawReserve();
  ctx.restore();ctx.globalAlpha=1;
  for(const j of jumpers)if(j.y<H+40)drawCreature(j.x,j.y,j.tier,j.sp,TIERS[j.tier].r*.6*KS,t,j.rot);
  for(const a of attackers){const s=aScale(a);
    if(a.pre>0){const k=clamp(1-a.pre/(CHARGE+.25),0,1);
      for(let i=0;i<2;i++){const ph=(k*1.6+i*.5)%1;ctx.strokeStyle='rgba(255,110,90,'+(.7*(1-ph))+')';ctx.lineWidth=2.5;
        ctx.beginPath();ctx.ellipse(a.x,a.y+GR*.4,GR*(1+ph*1.3),GR*(.35+ph*.5),0,0,Math.PI*2);ctx.stroke()}
      ctx.save();ctx.globalAlpha=Math.min(1,k*3);ctx.translate(a.x,a.y+GR*.15*k);ctx.scale(1+.16*k,1-.2*k);drawCreature(0,0,GIANT,'red',GR,t);ctx.restore();continue}
    if(!a.swatted){ctx.strokeStyle='rgba(255,90,70,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(a.x,a.y,GR*s+8+Math.sin(t*14)*3,0,Math.PI*2);ctx.stroke()}
    drawCreature(a.x,a.y,GIANT,'red',GR,t,a.rot,null,s);
  }
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;dot(p.x,p.y,p.r)}
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const s of texts){ctx.globalAlpha=Math.min(1,s.life*1.5);ctx.font='400 '+s.size+'px '+FONT;
    ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.5)';ctx.strokeText(s.s,s.x,s.y);ctx.fillStyle=s.c;ctx.fillText(s.s,s.x,s.y)}
  ctx.globalAlpha=1;
  if(vl>.05){if(!vigGrad){vigGrad=ctx.createRadialGradient(W/2,H*.45,H*.3,W/2,H*.45,H*.78);vigGrad.addColorStop(0,'rgba(8,45,60,0)');vigGrad.addColorStop(1,'rgba(8,45,60,1)')}
    ctx.globalAlpha=Math.min(.85,vl*.9);ctx.fillStyle=vigGrad;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  if(state==='play')drawHUD();
  drawIntro();
  drawTut();
  ctx.restore();
  if(state==='start'||state==='intro')drawTitle();
  if(state==='over'||state==='win')drawEnd();
}
// the death screen: up to 10 coins fly one after another into the piggy bank
const COIN_FLY=.5,COIN_GAP=.13;
const coinFlyN=()=>Math.min(10,endFx.saved||0);
const coinLaunch=i=>SUMMARY_AT+.8+i*COIN_GAP;
const coinLandAt=i=>i<0?-9:coinLaunch(i)+COIN_FLY;
const coinsLanded=e=>{let n=0;for(let i=0;i<coinFlyN();i++)if(e>=coinLandAt(i))n++;return n};
const endReady=()=>t-endT0>Math.max(SUMMARY_AT+.9,coinLandAt(coinFlyN()-1)+.2);
function drawEnd(){
  const e=t-endT0;
  const dim=clamp((e-.3)/(SUMMARY_AT-.3),0,1)*.86;ctx.fillStyle='rgba(6,20,16,'+dim+')';ctx.fillRect(0,0,W,H);
  const k=clamp((e-SUMMARY_AT)/.35,0,1);if(k<=0)return;
  ctx.textAlign='center';ctx.globalAlpha=k;
  ctx.font='400 40px '+FONT;ctx.fillStyle='#9fd8e8';ctx.fillText('Sunk!',W/2,120-14*(1-k));
  ctx.font='400 17px '+FONT;ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillText(hits>=MAX_HITS?'The red frogs got you':'Too many frogs aboard',W/2,150);
  ctx.globalAlpha=clamp((e-SUMMARY_AT-.3)/.3,0,1);
  ctx.font='400 46px '+FONT;ctx.fillStyle='#fff';ctx.fillText(Math.floor(meters)+' m',W/2,232);
  ctx.font='400 17px '+FONT;ctx.fillStyle='#cfe9ff';ctx.fillText('paddled · bank '+seg+' reached',W/2,258);
  ctx.fillStyle=endFx.newBest?'#ffa043':'#cfe9ff';ctx.fillText(endFx.newBest?'New best!':'Best '+runBest,W/2,284);
  // coins: this run's pile on the left, 10% of it flies into the piggy bank on the right
  const sv=endFx.saved||0,nf=coinFlyN(),landedN=coinsLanded(e),shown=nf?Math.round(sv*landedN/nf):0;
  const CX=W/2-70,CY=344,PX=W/2+62,PY=346;
  coinIcon(CX-18,CY-6,11);ctx.font='400 24px '+FONT;ctx.fillStyle='#ffe27a';ctx.textAlign='left';ctx.fillText(String(coins),CX-2,CY+2);ctx.textAlign='center';
  ctx.font='400 13px '+FONT;ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillText('this run',CX,CY+24);
  // the piggy bank hops a little each time a coin drops in
  const since=e-coinLandAt(landedN-1),hop=landedN>0&&since<.18?Math.sin(since/.18*Math.PI)*.18:0;
  ctx.save();ctx.translate(PX,PY);ctx.scale(1+hop,1-hop*.6);ctx.font='48px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';ctx.fillText('🐷',0,14);ctx.restore();
  // its '10%' tag
  ctx.save();ctx.translate(PX+30,PY-22);ctx.rotate(.18);ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.roundRect?ctx.roundRect(-20,-11,40,22,6):ctx.rect(-20,-11,40,22);ctx.fill();
  ctx.fillStyle='#3b2a22';ctx.font='400 15px '+FONT;ctx.fillText('10%',0,5);ctx.restore();
  ctx.font='400 17px '+FONT;ctx.fillStyle='#ffe27a';ctx.fillText('+'+shown+' saved',PX,PY+44);
  for(let i=0;i<nf;i++){const t0=coinLaunch(i),p=(e-t0)/COIN_FLY;if(p<0||p>=1)continue;const q=p*p*(3-2*p);
    coinIcon(CX-18+(PX-(CX-18))*q,CY-6+(PY-6-(CY-6))*q-Math.sin(p*Math.PI)*34,8)}
  if(boatItems.length){ctx.font='400 15px '+FONT;ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillText('Still aboard for next time:',W/2,428);
    ctx.font='26px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';ctx.fillText(boatItems.map(k=>ITEMS[k].icon).join('  '),W/2,462)}
  ctx.globalAlpha=1;
  if(endReady()){ctx.font='400 19px '+FONT;ctx.fillStyle='#ffe27a';ctx.globalAlpha=.6+Math.sin(performance.now()/300)*.4;ctx.fillText('Tap to paddle again',W/2,H-60);ctx.globalAlpha=1}
}

startScene();
let last=performance.now();
function loop(now){
  const dt=Math.min(1/30,(now-last)/1000);last=now;
  if(state==='play')update(dt);else{t+=dt;endUpdate(dt);if(state==='intro')introUpdate(dt)}
  for(const f of flyers)f.t+=dt;
  const L=Math.min(level,100),vt=L<25?L/25*.35:.35+(L-25)/75*.65;
  vl+=(vt-vl)*Math.min(1,dt*(state==='play'&&level<100?3:1.6));
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
}
</script>
