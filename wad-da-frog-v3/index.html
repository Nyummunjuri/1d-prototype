<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wad da Frog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0c231d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
{
// Wad da Frog — endless. Frogs climb aboard your kayak; throw them back into the swamp.
// Two of the same stage and colour merge. Each colour has its own number of stages; the last stage uses its ability.
// The swamp keeps flowing toward you; too much weight aboard and the kayak sinks.
const W=360,H=640;
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const FONT='Boogaloo, system-ui, sans-serif';
let PX=1;const spriteCache=new Map();
function resize(){
  const s=Math.min(innerWidth/W,innerHeight/H),d=Math.min(2,window.devicePixelRatio||1);PX=s*d;spriteCache.clear();
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=Math.round(W*s*d);cv.height=Math.round(H*s*d);
  ctx.setTransform(s*d,0,0,s*d,0,0)}
addEventListener('resize',resize);resize();

// ---------- stages & species ----------
// 0 egg, 1 tadpole (no colour yet), 2 tadpole with legs, 3 tiny frog, 4 teen, 5 grown, 6 adult (uses its ability)
const STAGES=[{name:'Egg',r:10,w:1},{name:'Tadpole',r:12.5,w:1.5},{name:'Legs',r:15.5,w:2},{name:'Tiny frog',r:19,w:3},
  {name:'Teen',r:23,w:4},{name:'Grown',r:28,w:5.5},{name:'Adult',r:34,w:7}];
const ADULT=6;
const SPECIES={
  green: {c:'#74c94f',d:'#3f8a2c',name:'Green',   chain:[0,1,4,6],      odds:.40,mult:1, what:'Basic frog: just hops off'},
  red:   {c:'#e8553f',d:'#9c2a1e',name:'Red',     chain:[0,1,4,6],      odds:.07,mult:2, what:'Leaps onto your kayak! Tap to slap it away'},
  purple:{c:'#9a62e0',d:'#5e3699',name:'Purple',  chain:[0,1,2,4,6],    odds:.05,mult:3, what:'Poison turns frogs nearby purple'},
  orange:{c:'#f29a38',d:'#b0601a',name:'Orange',  chain:[0,1,2,4,6],    odds:.12,mult:3, what:'Swirls the pond before leaving'},
  blue:  {c:'#4fa8e6',d:'#24639a',name:'Blue',    chain:[0,1,2,3,4,6],  odds:.12,mult:4, what:'Explodes, clearing frogs around it'},
  yellow:{c:'#f2d23c',d:'#b5961a',name:'Yellow',  chain:[0,1,2,3,4,5,6],odds:.04,mult:10,what:'Rare! Lots of coins'},
};
const SP_KEYS=Object.keys(SPECIES);
const RARITY={green:[1,'Common','#bfe3a8'],red:[2,'Uncommon','#ff9a85'],purple:[3,'Rare','#c79bff'],orange:[3,'Rare','#ffc04a'],blue:[4,'Epic','#7ac8ff'],yellow:[5,'Legendary','#ffe27a']};
const mult=sp=>sp?SPECIES[sp].mult:1;
// new kinds of frog join the swamp the further you get
const RED_ODDS=[.035,.01,5];   // red: 3.5% of the swamp at first, +1% each event, up to 8.5%
const UNLOCK={green:0,red:0,orange:150,purple:300,blue:450,yellow:650};
let unlocked=['green','red'];
const odds=k=>k==='red'?RED_ODDS[0]+RED_ODDS[1]*Math.min(RED_ODDS[2],typeof evN==='number'?evN:0):SPECIES[k].odds;   // red frogs get more common event by event
function rollSp(){const tot=unlocked.reduce((a,k)=>a+odds(k),0);let r=Math.random()*tot;for(const k of unlocked){r-=odds(k);if(r<=0)return k}return 'green'}
// a random frog that is not an adult yet: eggs and tadpoles most of the time
function rollFrog(pEgg,pTad){const r=Math.random();if(r<pEgg)return[0,null];if(r<pEgg+pTad)return[1,null];
  const sp=rollSp(),ch=SPECIES[sp].chain,i=2+Math.floor(Math.random()*(ch.length-3));return[ch[i],sp]}
function nextOf(st,sp){if(st===0)return[1,null];if(st===1){const s=rollSp();return[SPECIES[s].chain[2],s]}
  const ch=SPECIES[sp].chain;return[ch[ch.indexOf(st)+1],sp]}

// ---------- tuning ----------
const TOP=62;                     // far edge of the swamp: frogs float up to here
const BOAT_Y=432;                 // the kayak's bow: pile frogs reaching here climb aboard
const G=-280;                     // buoyancy: everything floats UP
const THROW_SPEED=820;   // slow enough to watch the frog fly
const FLICK=38;   // swipe this far (upward) and the frog flies, no need to lift the finger
const HITSTOP_BIG=.06;
const RING_CHAIN=5;   // the coloured flash ring only shows on a chain of 5+ merges   // a tiny freeze on big merges / chains so they land with weight
const CAP=30;                     // weight that sinks the kayak (gauge 100%)
const START_LOAD=.2;
const SINK_TIME=3;                // seconds over 100% before it goes under (heartbeat while it lasts)
const MERCY_HI=.85,MERCY_SLOW=.55,MERCY_LO=.35,MERCY_FAST=1.3,MERCY_WAIT=3;   // hidden: frogs board slower when the kayak is nearly full, faster when it has been light for a while
const CLOSE_CALL=1.2,PHEW_COINS=15;   // over 100% this long and you still saved it = Phew!
const BOARD_START=.9, BOARD_MIN=.5, BOARD_RAMP=180;   // a frog climbs aboard every BOARD_START s, down to BOARD_MIN over BOARD_RAMP s
const ROW_START=9, ROW_MIN=4, ROW_RAMP=180;            // a new row flows in from the far edge
const ENTER=1.1;
const START_ROWS=4;
const BOW_FROGS=3;
const REED_HOLD=2;   // a frog that reaches the reeds is stuck there this long before it climbs aboard
const MIN_BOARD_GAP=.45, OVERFLOW_GAP=.14;   // at most one boarder every MIN_BOARD_GAP s; pile frogs that reach the bow climb aboard one by one   // the kayak always has at least this many frogs ready at the bow (topped up at once)
const DEPTH_BOARD=[.6,2.2];   // frogs climb aboard x0.6 when the swamp is thin, up to x1.8 when it is piled up to the bow
const STRAY_TIME=2;           // a throw that touches nothing for this long floats back to the kayak
const WAVE_EVERY=45, WAVE_FIRST=60, WARN=2.5, RUSH=10, CALM=7;   // a rush every WAVE_EVERY s (first at WAVE_FIRST), then a breather
// events: calm flow, then the lily pads shake, then an event bursts out, then a breather. Every event the swamp gets a little faster
const EV_FIRST=30, EV_GAP0=24, EV_GAP_MIN=12, EV_GAP_STEP=1.5;   // seconds of normal flow before the next event (shrinks each event)
const EV_WARN=2.2, EV_CALM=6, EGG_FEAST=9, BURST_ROWS=3, BURST_TIME=.55, ROW_H=46;
const LV_START=60, LV_RATE=.003;   // the main difficulty: after the first minute, boarding and rows keep speeding up with time (+0.4% a second, no ceiling)
const EV_W={rows:.45,reds:.3,eggs:.25};
const CRACKS_MAX=3;
const RAID_FROM=3;   // the red raid can come from the 4th event on   // a red frog crashing on the kayak cracks it; the third crack sinks it
const EGG_RAIN=.15, EGG_BOARD=2.2;   // chance a wave is an egg rain instead of a rush; eggs climb aboard this much faster
const RUSH_ROWS=2.4, RUSH_BOARD=1.8, CALM_BOARD=.45;              // how much faster rows / boarders come during a rush; boarders during a calm
const ADULT_WAIT=.55;             // an adult crouches this long, then uses its ability
const BLAST_R=55, POISON_R=78, SWIRL_TIME=2.4;
const RED_LEAP=1.15;
const YELLOW_COINS=100;
const HEARTS_MAX=3, HEART_REGEN=10*60*1000;
const DOWN=24;   // the kayak sits this much lower (partly off the bottom of the screen)
const KY=61.6+DOWN/1.35,KS=1.35,KB=680;
const K=(x,y)=>[180+(x-180)*KS,KB-(KB-(y+KY))*KS];
const BOW=K(180,498);
// spots on the deck for frogs aboard (front one sits on the bow)
const DECK=[[150,580],[210,580],[124,602],[236,602],[180,624],[153,652],[207,652],[100,626],[260,626],[110,654],[250,654],[180,664],[80,650],[280,650],[62,670],[298,670]];   // screen spots, the cockpit seats too
const SEATS=[[30,500],[30,535],[30,570]];   // item pads along the left edge (tap to use)   // cockpit seats: items sit here

// ---------- items (bought in the shop when you sink; up to 3 sit in the cockpit seats and stay there between runs; tap to use) ----------
const ITEMS={rainbow:{icon:'🌈',name:'Rainbow',desc:'Any colours merge for a moment'},
  bucket:{icon:'🪣',name:'Bucket',desc:'Scoops frogs off the kayak'},
  net:{icon:'🥅',name:'Net',desc:'Stops the next red frog (works by itself)'}};
const ITEM_KEYS=Object.keys(ITEMS),ITEM_MAX=3,RAINBOW_TIME=6;
// ---------- state ----------
let state='start',t=0,frogs=[],parts=[],texts=[],leavers=[],reds=[],deckReds=[],slapped=[],clouds=[],raft=[],
  coins=0,meters=0,pace=0,cool=0,rowT=0,boardT=0,sinkT=0,load=0,thrown=0,drag=null,endT=0,scroll=0,shake=0,pileLow=0,
  lastMergeT=-9,chainLen=0,gaugePulse=0,coinPop=0,endInfo=null,redHint=false;
let hullHit=0,card=null,cardT=0,lastP=null,padP={x:0,y:0},padV={x:0,y:0},praiseT=0,streak=0,cheer=0,coinFly=[],boardGap=0,hoppers=[],overflowQ=0,rings=[],recoil=0,hitstop=0,strays=[],hold=null,boatItems=[],shop=[],poorT=0,restartT=0,jumpers=[],piggyShow=0,rainbowT=0,nets=0,redGrab=null,waveKind='rush',waveN=0,banner=null,wave='normal',aimed=null,wallet=0,bestM=0;try{boatItems=JSON.parse(localStorage.getItem('wadItems4')||'[]').filter(k=>ITEMS[k]).slice(0,3);wallet=+localStorage.getItem('wadWallet')||0;bestM=+localStorage.getItem('wadBestM4')||0}catch(e){}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
function mk(st,sp,x,y,vx=0,vy=0){return{st,sp,x,y,vx,vy,r:STAGES[st].r,pop:.25,rot:rnd(-.2,.2),dead:false,thrown:false,enter:0,awake:false,act:0}}

// ---------- hearts: 3 plays, one comes back every 10 minutes ----------
let hearts={n:HEARTS_MAX,t0:Date.now()};
try{const h=JSON.parse(localStorage.getItem('wadHearts')||'null');if(h&&h.n>=0)hearts=h}catch(e){}
function heartsTick(){if(hearts.n>=HEARTS_MAX){hearts.t0=Date.now();return}
  const g=Math.floor((Date.now()-hearts.t0)/HEART_REGEN);if(g>0){hearts.n=Math.min(HEARTS_MAX,hearts.n+g);hearts.t0+=g*HEART_REGEN;saveHearts()}}
function saveHearts(){try{localStorage.setItem('wadHearts',JSON.stringify(hearts))}catch(e){}}
function nextHeartIn(){return Math.max(0,HEART_REGEN-(Date.now()-hearts.t0))}

// ---------- swamp ----------
function makeRow(entering){
  const row=[];let x=0,prev=null;
  while(true){let q,n=0;do{q=rollFrog(.22,.22)}while(prev&&q[0]===prev[0]&&q[1]===prev[1]&&++n<10);
    const r=STAGES[q[0]].r;if(x+2*r>W+4)break;row.push({st:q[0],sp:q[1],x:x+r,r});x+=2*r+1;prev=q}
  const spare=W-x;row.forEach((q,i)=>q.x+=spare*(i+.5)/row.length);
  return row.map(q=>{const f=mk(q.st,q.sp,q.x,entering?TOP-q.r:TOP+q.r);f.pop=0;if(entering){f.enter=ENTER;f.ty=TOP+q.r;f.sy=TOP-q.r}return f})}
function addRow(entering){const row=makeRow(entering);if(!entering)for(const f of frogs)f.y+=2*STAGES[3].r;frogs.push(...row)}
// what climbs aboard (your ammo): each kind has its own chance; coloured ones arrive at their first coloured stage
const AMMO=[[0,null,.26],[1,null,.22],['green',.18],['red',.025],['purple',.02],['orange',.05],['blue',.04],['yellow',.02]];
function rollAmmo(){const ok=AMMO.filter(a=>a.length===3||unlocked.includes(a[0])),tot=ok.reduce((s,a)=>s+a[a.length-1],0);let r=Math.random()*tot;for(const a of ok){const p=a[a.length-1];r-=p;if(r<=0)return a.length===3?[a[0],a[1]]:[SPECIES[a[0]].chain[2],a[0]]}return[0,null]}
// frogs coming aboard hop in an arc from where they are to their spot on the kayak; they only count once they land
const slotPos=i=>i===0?[BOW[0],BOW[1]]:DECK[(i-1)%DECK.length];
const ENTRY=[264,628], ENTRY_WATER=[306,644];   // frogs climb on at the lower right of the kayak
function hop(st,sp,x,y,delay=0,dur=.3,tx=ENTRY[0],ty=ENTRY[1]){hoppers.push({st,sp,x0:x,y0:y,x,y,tx,ty,t:-delay,dur})}
function boardOne(){const[st,sp]=nextAmmo();hop(st,sp,ENTRY_WATER[0]+rnd(-4,8),ENTRY_WATER[1]+rnd(-6,6));splash(ENTRY_WATER[0],ENTRY_WATER[1])}

const USE_HEARTS=false;   // hearts are switched off for now (the code stays for later)
function useHeart(){if(!USE_HEARTS)return true;heartsTick();if(hearts.n<=0)return false;if(hearts.n>=HEARTS_MAX)hearts.t0=Date.now();hearts.n--;saveHearts();return true}

// ---------- first run only: a tutorial with no words. The swamp brings one new thing at a time and a ghost hand shows how ----------
// 1 swipe to throw · 2 same colour to merge · 3 too heavy, throw to lighten · 4 frogs eat eggs · 5 slap the red frog
// the bucket is taught in the real game: the first time the kayak gets really heavy, time slows, the bucket bounces and the hand taps it
let seen=[];try{seen=JSON.parse(localStorage.getItem('wadSeen4')||'[]')}catch(e){}
let evCount={rows:0,reds:0,eggs:0},raidX=[];
let rainNote=0;
let moodK=0,calmK=0,drumT=0;
const HB_FROM=.5;
let beatFx=0;
let lowT=0,beatT=0,closeCall=false,phewT=0,evT=EV_FIRST,evKind='',evN=0,evDur=0,redsSeen=false,cracks=0,crackFx=0;
let tut=null,tutDoneFlag=false,idleT=0,t0w=0,pulseItem=-1,bucketTold=false,bucketTip=false,slowT=0;try{tutDoneFlag=!!localStorage.getItem('wadTut4');bucketTold=!!localStorage.getItem('wadBucket4')}catch(e){}
const nextAmmo=()=>tut&&tut.ammo?tut.ammo():wave==='event'&&evKind==='eggs'?[0,null]:rollAmmo();
const rw=()=>raft.reduce((a,it)=>a+STAGES[it.st].w,0)+hoppers.reduce((a,h)=>a+STAGES[h.st].w,0);
function put(st,sp,x){const r=STAGES[st].r,f=mk(st,sp,x,TOP-r);f.pop=0;f.enter=ENTER;f.sy=TOP-r;f.ty=TOP+r;frogs.push(f);return f}   // slides out from under the lily pads, like every row
function later(d,fn){tut.q.push({d,fn})}   // the next row comes out once the one before is clear of the pads
function tutClear(){for(const f of frogs)if(!f.dead)leavers.push({st:f.st,sp:f.sp,x:f.x,y:f.y,vx:rnd(-80,80),vy:rnd(-420,-300),t:0});frogs=[]}
function loadUp(to){let w=rw(),n=0;while(w<to*CAP){const[st,sp]=rollAmmo();hop(st,sp,ENTRY_WATER[0]+rnd(-4,8),ENTRY_WATER[1]+rnd(-6,6),n*.22,.3);w+=STAGES[st].w;n++}}
const TUT=[
  {set(){put(4,'green',180);tut.ammo=()=>[4,'green']},                                     // 1 one frog, the same as the one on the bow
   done:()=>tut.merged, hand:()=>tut.target()},
  {set(){put(4,'red',180);put(4,'green',80);tut.ammo=()=>[4,'green']},                 // 2 a red one straight ahead, the green match off to the side
   done:()=>tut.merged, hand:()=>frogs.find(f=>f.sp==='green'&&f.st===4&&!f.mine)},
  {set(){addRow(true);later(ENTER+.1,()=>addRow(true));tut.ammo=null;loadUp(.92)},   // 3 a pile climbs aboard: the kayak starts to flood
   done:()=>tut.t>2&&!hoppers.length&&load<.5, hand:()=>load>=.5?{x:180,y:100}:null},
  {set(){put(4,'green',180);for(const it of raft)leavers.push({st:it.st,sp:it.sp,x:it.px??BOW[0],y:it.py??BOW[1],vx:rnd(-120,120),vy:rnd(-460,-340),t:0});raft=[];tut.ammo=()=>[0,null]},   // 4 the kayak swaps to eggs, and a frog that eats them
   done:()=>tut.ate>=2, hand:()=>frogs.find(f=>f.sp==='green'&&f.st===4&&!f.mine)},
  {set(){tut.red=put(ADULT,'red',180);tut.redT=ENTER+1.2;later(ENTER+.1,()=>addRow(true));tut.ammo=null},   // 5 a red frog crouches, leaps at the kayak
   done:()=>tut.t>2&&!tut.red&&!reds.length&&!slapped.length&&!raft.some(r=>r.sp==='red'&&r.st===ADULT), hand:()=>raft[0]&&raft[0].sp==='red'&&raft[0].st===ADULT?{x:180,y:100}:null},
];
function tutStart(){tut={i:-1,t:0,wait:0,peak:0};unlocked=['green'];redHint=true;frogs=[];
  raft=[{st:4,sp:'green',pop:0},{st:4,sp:'green',pop:0},{st:4,sp:'green',pop:0}];tutNext()}
function tutNext(){tut.i++;tut.t=0;tut.merged=false;tut.used=null;tut.peak=0;tut.ate=0;tut.q=[];idleT=0;
  if(tut.i>=TUT.length){tutEnd();return}
  if(tut.i>0){tutClear();tone(1319,.12,'triangle',.1);setTimeout(()=>tone(1760,.16,'triangle',.1),90)}
  TUT[tut.i].set();tut.target=()=>frogs.find(f=>!f.mine&&!f.dead)}
function tutEnd(){tut=null;tutDoneFlag=true;try{localStorage.setItem('wadTut4','1')}catch(e){}
  unlocked=['green','red'];t0w=t;rowT=.5;boardT=BOARD_START;fanfare();burst(W/2,300,'#ffe27a',20)}
function tutUpdate(dt){tut.t+=dt;tut.peak=Math.max(tut.peak,load);
  for(const q of tut.q){q.d-=dt;if(q.d<=0&&!q.done){q.done=true;q.fn()}}tut.q=tut.q.filter(q=>!q.done);
  if(tut.wait>0){tut.wait-=dt;if(tut.wait<=0)tutNext();return}
  if(tut.red){if(tut.red.dead)tut.red=null;else if(tut.redT>0){tut.redT-=dt;if(tut.redT<=0){tut.red.act=ADULT_WAIT;tut.red.vx=tut.red.vy=0}}}
  if(tut.i===3&&!frogs.some(f=>f.sp==='green'&&f.st>=3&&f.st<ADULT))put(4,'green',180);   // the eater got merged away: another one
  if(tut.i===2&&idleT>2&&load>=.5&&(tut.auto||0)<3){tut.autoCd=(tut.autoCd||0)-dt;if(tut.autoCd<=0&&cool<=0&&raft.length){throwFrog(rnd(-.15,.15),-1);tut.auto=(tut.auto||0)+1;tut.autoCd=.45}}   // still waiting: the hand throws a few for them
  if(TUT[tut.i].done())tut.wait=tut.i===TUT.length-1?.4:.9}
// the ghost hand: swipes toward the frog to hit, taps the red frog in the air, taps the bucket
function handSwipe(tx,ty){const c=(t%1.6)/1.6,sx=180,sy=590,dx=tx-BOW[0],dy=ty-BOW[1],l=Math.hypot(dx,dy)||1,L=115,
  m=clamp((c-.15)/.4,0,1),e=m*m*(3-2*m),x=sx+dx/l*L*e,y=sy+dy/l*L*e,a=c<.1?c/.1:c>.75?Math.max(0,1-(c-.75)/.15):1;
  if(e>0){ctx.strokeStyle='rgba(255,255,255,'+(.5*a)+')';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(x,y);ctx.stroke()}
  drawHand(x,y,c<.15?c/.15:0,a)}
function handFlick(x,y){const c=(t%.55)/.55,m=clamp(c/.35,0,1),e=1-(1-m)*(1-m),yy=y-46*e,a=c<.08?c/.08:c>.6?Math.max(0,1-(c-.6)/.3):1;
  if(e>0){ctx.strokeStyle='rgba(255,255,255,'+(.55*a)+')';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,yy);ctx.stroke()}drawHand(x,yy,c<.1?c/.1:0,a)}
function handTap(x,y){const c=(t%1)/1,down=c<.25?1-c/.25:0;drawHand(x+6,y+10-8*down,c>.25&&c<.6?(c-.25)/.35:0,1)}
function drawTutHand(){if(!tut||tut.wait>0)return;
  if(tut.i===4&&reds.length&&!reds[0].done){handTap(reds[0].x,reds[0].y);return}   // the red frog is in the air: tap it now
  if(tut.i===2&&!drag&&load>.45){handFlick(222,598);return}   // too heavy: quick flicks, right on the kayak
  if(drag||idleT<1)return;
  const g=TUT[tut.i].hand();if(g)handSwipe(g.x,g.y)}

// rainbow item: a rainbow arches over the swamp, shrinking and fading as the time runs out
function drawRainbow(){if(rainbowT<=0||state!=='play')return;const k=rainbowT/RAINBOW_TIME,a=Math.min(1,(RAINBOW_TIME-rainbowT)/.4)*Math.min(1,k*3);
  const R=210*(.55+.45*k),cx=W/2,cy=BOAT_Y+40,cols=['#ff5a5a','#ff9a3a','#ffe14a','#6ee06a','#4fb8ff','#6a7cff','#b56aff'];
  ctx.save();ctx.globalAlpha=.42*a;ctx.lineWidth=7;for(let i=0;i<cols.length;i++){ctx.strokeStyle=cols[i];ctx.beginPath();ctx.arc(cx,cy,R-i*7,Math.PI*1.05,Math.PI*1.95);ctx.stroke()}ctx.restore()}
// ---------- events ----------
const MOOD={rows:[0,18,30,.34],reds:[215,30,20,.46],eggs:[255,210,105,.22]};
const RAID_X=[109,180,251];
function drawMood(){if(state!=='play'&&state!=='card')return;
  if(moodK>.01&&MOOD[evKind]){const[r,g,b,a]=MOOD[evKind];ctx.fillStyle='rgba('+r+','+g+','+b+','+(a*moodK)+')';ctx.fillRect(0,0,W,H);
    if(evKind==='rows'){ctx.strokeStyle='rgba(220,245,255,'+(.22*moodK)+')';ctx.lineWidth=2;ctx.lineCap='round';   // the current: streaks rushing from the pads toward you

// ---------- physics ----------
function physics(dt,quiet){

    if(f.enter>0){f.enter=Math.max(0,f.enter-dt);const k=1-f.enter/(f.ed||ENTER),e=k*k*(3-2*k);f.y=f.sy+(f.ty-f.sy)*e;f.vx=f.vy=0;continue}

    f.vx*=Math.pow(f.thrown?.993:.9,dt*60);f.vy*=Math.pow(f.thrown?.996:.92,dt*60);
    if(f.thrown&&Math.random()<dt*45)parts.push({x:f.x-f.vx*.012,y:f.y-f.vy*.012,vx:-f.vx*.05,vy:-f.vy*.05,r:1.5+Math.random()*2.5,c:'rgba(220,245,255,.75)',life:.35});   // spray trail
    f.x+=f.vx*dt;f.y+=f.vy*dt;
    if(f.thrown&&(Math.hypot(f.vx,f.vy)<120||f.y<TOP+f.r+2))f.thrown=false;
    if(f.x<f.r){f.x=f.r;f.vx=Math.abs(f.vx)*.4}if(f.x>W-f.r){f.x=W-f.r;f.vx=-Math.abs(f.vx)*.4}
    if(f.y<TOP+f.r){f.y=TOP+f.r;f.vy=Math.abs(f.vy)*.15}
    if(f.missT>0&&!quiet){f.missT-=dt;if(f.missT<=0&&f.mine){f.mine=false;missShot()}}
    f.pop=Math.max(0,f.pop-dt);f.rot*=Math.pow(.96,dt*60);if(Math.abs(f.rot)<.015)f.rot=0;if(f.gulp>0)f.gulp-=dt;
    if(f.act>0&&!quiet){f.act-=dt;if(f.act<=0)ability(f)}}
  for(let pass=0;pass<4;pass++)
    for(let i=0;i<frogs.length;i++){const a=frogs[i];if(a.dead)continue;
      for(let j=i+1;j<frogs.length;j++){const b=frogs[j];if(b.dead)continue;
        const dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r;if(Math.abs(dx)>m||Math.abs(dy)>m)continue;
        const d=Math.hypot(dx,dy);if(d>=m)continue;
        // same stage + same colour touching = merge; frogs that flowed in sleep until an awake one (yours, or one just made) touches them
        if(!quiet&&(a.shot||b.shot)){const egg=a.shot?a:b,o=egg===a?b:a;egg.shot=false;if(canEat(o)){eat(o,egg);if(a.dead)break;continue}}

const SCALE=[523,587,659,698,784,880,988,1047,1175,1319,1397,1568,1760,1976,2093];

  for(let i=0;i<SEATS.length;i++){const[px,py]=SEATS[i];ctx.fillStyle=boatItems[i]?'rgba(70,150,80,.95)':'rgba(60,130,70,.45)';ell(px,py+3,17,12);
    ctx.fillStyle='rgba(30,90,45,.9)';ctx.beginPath();ctx.moveTo(px,py+3);ctx.arc(px,py+3,17,-.3,.15);ctx.fill()}
  ctx.restore();
  for(const w of strays)drawFrog(w.st,w.sp,w.cx,w.cy,STAGES[w.st].r*.85,w.t*6,1);
  for(const h of hoppers){const k=h.t<0?0:Math.min(1,h.t/h.dur),r=STAGES[h.st].r*(1-.25*k)*(1+.12*Math.sin(k*Math.PI));drawFrog(h.st,h.sp,h.x,h.y+(h.t<0?Math.sin(t*20)*1.5:0),r,0,1)}
  const cheerY=i=>cheer>0?-Math.abs(Math.sin((cheer/.45)*Math.PI*1.5+i*.7))*Math.min(12,3+streak)*(cheer/.45):0;
  for(let i=raft.length-1;i>=1;i--){const it=raft[i],[sx,sy]=slotPos(i),r=STAGES[it.st].r*.75;
    drawFrog(it.st,it.sp,it.px??sx,(it.py??sy)+bob+cheerY(i),r,0,1+(it.pop>0?Math.sin(it.pop/.3*Math.PI)*.25:0))}
  for(const d of deckReds){const sc=1+Math.sin(d.t*6)*.04;drawFrog(ADULT,'red',d.x,d.y+bob,STAGES[ADULT].r*.8,Math.sin(d.t*3)*.1,sc);
    ctx.strokeStyle='rgba(255,154,133,'+(.5+.4*Math.sin(t*10))+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(d.x,d.y+bob,STAGES[ADULT].r*.8+6,0,7);ctx.stroke()}
  drawMission();
  for(let i=0;i<boatItems.length;i++){const[x,y]=SEATS[i];const sp0=seatPop&&seatPop.i===i?seatPop.t/.5:-1;if(i===pulseItem||sp0>=0){const z=sp0>=0?(sp0<.6?1.35*Math.sin(sp0/.6*Math.PI/2):1.35-.35*(sp0-.6)/.4):1+.16*Math.abs(Math.sin(t*6));ctx.save();ctx.translate(x-hullX,y+1);ctx.scale(z,z);drawSticker(ITEMS[boatItems[i]].icon,0,0,22);ctx.restore()}else drawSticker(ITEMS[boatItems[i]].icon,x-hullX,y+1,22)}
  if(nets>0){ctx.strokeStyle='rgba(240,240,230,.55)';ctx.lineWidth=1.5;const cx=180,cy=BOW[1]+30+bob;
    for(let i=-4;i<=4;i++){ctx.beginPath();ctx.moveTo(cx+i*12-30,cy-30);ctx.lineTo(cx+i*12+30,cy+30);ctx.moveTo(cx+i*12+30,cy-30);ctx.lineTo(cx+i*12-30,cy+30);ctx.stroke()}}
  const nx=raft[0];
  if(nx){let ang=0;if(aiming()){const[ax,ay]=aimDir(drag.cx-drag.x,drag.cy-drag.y);ang=Math.atan2(ax,-ay)}
    {const[px,py]=[BOW[0]+padP.x,BOW[1]+bob+4+padP.y],k=recoil*recoil*.5,pr=24*(1-.1*k);   // launch pad: pulled back with your swipe, springs forward when you let go
      ctx.fillStyle='rgba(0,0,0,.18)';ell(px,py+5,pr*1.05,pr*.42);
      ctx.fillStyle='#7a4a2a';ell(px,py+2+k*3,pr,pr*.48*(1-.2*k));ctx.fillStyle='#a8683a';ell(px,py+k*3,pr*.92,pr*.4*(1-.2*k));
      ctx.strokeStyle='rgba(255,230,190,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(px,py+k*3,pr*.6,pr*.24,0,0,7);ctx.stroke()}
    if(streak>=2){const g=Math.min(1,streak/10);ctx.fillStyle='rgba(255,'+Math.round(200-90*g)+',80,'+(.12+.25*g)*(.8+.2*Math.sin(t*8))+')';dot(nx.px??BOW[0],(nx.py??BOW[1])+bob,STAGES[nx.st].r+10+8*g)}
    if(cool<=0){ctx.strokeStyle='rgba(255,240,170,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(BOW[0],BOW[1]+bob,STAGES[nx.st].r+6+Math.sin(t*6)*1.5,0,7);ctx.stroke()}
    let ox=0,oy=0,sq=1;if(drag){const dx=drag.cx-drag.x,dy=drag.cy-drag.y,l=Math.hypot(dx,dy);if(l>4){const pull=Math.min(14,l*.12);ox=-dx/l*pull;oy=-dy/l*pull;sq=1+Math.min(.12,l*.0012)}}
    if(ox||oy){ctx.save();ctx.translate((nx.px??BOW[0])+ox,(nx.py??BOW[1])+bob+oy);ctx.rotate(ang);ctx.scale(1/sq,sq);drawFrog(nx.st,nx.sp,0,0,STAGES[nx.st].r,0,1);ctx.restore()}
    else drawFrog(nx.st,nx.sp,nx.px??BOW[0],(nx.py??BOW[1])+bob,STAGES[nx.st].r,ang,1)}
  ctx.restore();   // end of the kayak shake
  for(const r of reds){const R0=STAGES[ADULT].r,a=r.ang||0;
    if(r.diving){const m=r.mv||Math.PI,dx=Math.sin(m),dy=-Math.cos(m);ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2.5;ctx.lineCap='round';   // speed lines
      for(let i=-2;i<=2;i++){const px=-dy*i*9,py=dx*i*9,L=22+((i*7+Math.floor(t*30))%3)*8,o=R0+6+Math.abs(i)*4;ctx.beginPath();ctx.moveTo(r.x-dx*o+px,r.y-dy*o+py);ctx.lineTo(r.x-dx*(o+L)+px,r.y-dy*(o+L)+py);ctx.stroke()}}
    ctx.save();ctx.translate(r.x,r.y);ctx.rotate(a);if(r.diving)ctx.scale(.9,1.15);drawFrog(ADULT,'red',0,0,R0,0,1);ctx.restore()}
  for(const s of slapped){const q=s.sq/.12;ctx.save();ctx.translate(s.x,s.y);ctx.scale(1-.25*q,1+.2*q);drawFrog(ADULT,'red',0,0,STAGES[ADULT].r,s.rot,1);ctx.restore()}
  for(const x of texts){ctx.globalAlpha=Math.min(1,x.life*2.5);txt(x.s,x.x,x.y,x.size,x.c,'center')}ctx.globalAlpha=1}

// ---------- title: an empty swamp, one green frog on the bow; tap and it leaps in, then the game starts ----------
let intro=null;
const INTRO_JUMP=.55,INTRO_END=1.25,INTRO_TO=[180,380];
function beginIntro(){const f=raft.shift()||{st:4,sp:'green'};intro={st:f.st,sp:f.sp,x0:BOW[0],y0:BOW[1],x:BOW[0],y:BOW[1],t:0,splash:false};state='intro';tone(520,.1,'triangle',.1)}
function introUpdate(dt){const it=intro;it.t+=dt;const p=Math.min(1,it.t/INTRO_JUMP),[tx,ty]=INTRO_TO;
  it.x=it.x0+(tx-it.x0)*p;it.y=it.y0+(ty-it.y0)*p-Math.sin(p*Math.PI)*80;
  if(p>=1&&!it.splash){it.splash=true;tone(160,.25,'sine',.22,.45);tone(900,.08,'triangle',.08,.6);
    for(let i=0;i<16;i++){const a=-Math.PI*(.1+.8*Math.random()),v=80+Math.random()*140;parts.push({x:tx,y:ty,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:1.5+Math.random()*2.5,c:'rgba(205,240,255,.85)',life:.6})}}
  if(it.t>=INTRO_END){intro=null;newGame()}}
function drawIntro(){const it=intro;if(!it)return;const r=STAGES[it.st].r;
  if(!it.splash){drawFrog(it.st,it.sp,it.x,it.y,r,0,1+.15*Math.sin(Math.min(1,it.t/INTRO_JUMP)*Math.PI));return}
  const k=Math.min(1,Math.max(0,(it.t-INTRO_JUMP)/(INTRO_END-INTRO_JUMP)));
  for(let i=0;i<2;i++){const q=Math.min(1,Math.max(0,k*1.3-i*.3));ctx.strokeStyle='rgba(205,240,255,'+(.7*(1-q))+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(it.x,it.y,r*(.6+q*2),r*(.25+q*.7),0,0,Math.PI*2);ctx.stroke()}
  drawFrog(it.st,it.sp,it.x,it.y-6*k,r,0,1-.4*k,Math.max(0,1-k*2.2))}
function drawStart(){
  const a=state==='intro'?Math.max(0,1-intro.t/.3):1;if(a<=0)return;
  ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';
  ctx.font='400 56px '+FONT;ctx.lineWidth=8;ctx.lineJoin='round';ctx.strokeStyle='rgba(6,30,22,.55)';ctx.strokeText('Wad da Frog',W/2,215);ctx.fillStyle='#fff';ctx.fillText('Wad da Frog',W/2,215);
  ctx.font='400 22px '+FONT;ctx.globalAlpha=a*(.6+Math.sin(t*3)*.4);ctx.fillText('Tap to start',W/2,300);
  // the tutorial button, lower left: play the tutorial again
  ctx.globalAlpha=a;const[bx,by]=TUT_BTN;ctx.fillStyle='rgba(0,0,0,.25)';dot(bx+1,by+3,20);ctx.fillStyle='#fff8ec';dot(bx,by,20);
  ctx.font='400 26px '+FONT;ctx.fillStyle='#3f8a2c';ctx.textAlign='center';ctx.fillText('?',bx,by+9);
  ctx.restore()}
const TUT_BTN=[32,612];
// playing again from the sink screen: the frogs that sank the kayak jump off, the kayak bobs back up, the next frog stays on the bow
function playAgain(){if(USE_HEARTS&&hearts.n<=0)return;const keep=raft[0]||{st:0,sp:null,pop:0};
  jumpers=raft.slice(1).map((it,i)=>{const d=DECK[i%DECK.length];return{st:it.st,sp:it.sp,x:d[0],y:d[1]+60,vx:(d[0]<180?-1:1)*rnd(120,260),vy:rnd(-520,-380),t:-i*.04}});
  for(const d of deckReds)jumpers.push({st:ADULT,sp:'red',x:d.x,y:d.y+60,vx:rnd(-200,200),vy:-500,t:0});
  newGame(keep);state='restart';restartT=0;tone(520,.12,'triangle',.1);setTimeout(()=>tone(660,.14,'triangle',.1),120)}
const RESTART_TIME=1.4;
// sink screen layout
const PIGGY_CUT=.1;
const OVER_PIG=[W/2,290],BTN={x:W/2,y:540,w:200,h:52};
const coinsShown=()=>{const k=clamp((t-endT-1.5)/1.2,0,1);return Math.round(piggyShow+(wallet-piggyShow)*k)};
function drawOver(){const k=clamp((t-endT-.9)/.4,0,1);if(k<=0)return;const e=endInfo;
  ctx.globalAlpha=k;ctx.fillStyle='rgba(6,20,16,.75)';ctx.fillRect(0,0,W,H);
  txt('Sunk!',W/2,74,48,'#ff8a6a','center');
  txt(e.m+' m',W/2-50,124,36,'#ffffff','center');txt(Math.floor(e.secs/60)+':'+String(e.secs%60).padStart(2,'0'),W/2+60,124,36,'#ffffff','center');
  ctx.font='400 13px '+FONT;ctx.fillStyle='rgba(255,255,255,.6)';ctx.textAlign='center';ctx.fillText('distance',W/2-50,96);ctx.fillText('time',W/2+60,96);txt(e.newBest?'new best!':'best '+bestM+' m',W/2-50,146,15,e.newBest?'#c8ff9e':'rgba(255,255,255,.7)','center');
  txt('frogs '+e.frogCoins+'  +  distance '+e.bonus,W/2,182,16,'rgba(255,255,255,.75)','center');
  // the run's coins fly into the piggy bank
  const[px,py]=OVER_PIG,fk=t-endT-1.5;
  for(let i=0;i<10;i++){const p=(fk-i*.1)/.5;if(p<0||p>=1)continue;const q=p*p*(3-2*p);coinIcon(W/2+(px-W/2)*q,200+(py-200)*q-Math.sin(p*Math.PI)*40,7)}
  const hop=fk>0&&fk<1.5?Math.abs(Math.sin(fk*12))*.08:0,sx=poorT>0?Math.sin(t*55)*8*poorT/.6:0;
  ctx.save();ctx.translate(px+sx,py);ctx.scale(1+hop,1-hop*.6);ctx.font='56px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';ctx.textAlign='center';ctx.fillText('🐷',0,18);
  ctx.rotate(.15);ctx.fillStyle='#fff3c8';ctx.beginPath();ctx.roundRect(18,-30,40,20,6);ctx.fill();ctx.font='400 14px '+FONT;ctx.fillStyle='#8a4a1c';ctx.fillText('10%',38,-15);ctx.restore();   // the 10% tag
  coinIcon(W/2-30,py+46,9);txt(String(coinsShown()),W/2-16,py+53,24,poorT>0?'#ff6b5a':'#ffe27a');
  // shop: three items, tap to buy; they wait in the cockpit seats for the next run
  txt('Shop',W/2,384,18,'rgba(255,255,255,.8)','center');
  for(const c of shop){const it=ITEMS[c.k],shx=c.shakeT>0?Math.sin(t*60)*6*c.shakeT/.6:0;ctx.save();ctx.translate(c.x+shx,c.y);ctx.globalAlpha=k*(c.sold?.35:1);
    ctx.fillStyle='rgba(255,255,255,.1)';ctx.beginPath();ctx.roundRect(-46,-34,92,96,14);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='30px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';ctx.textAlign='center';ctx.fillText(it.icon,0,4);
    txt(it.name,0,26,14,'#ffffff','center');if(c.sold)txt('bought',0,50,15,'#c8ff9e','center');else{coinIcon(-16,44,7);txt(String(c.price),-6,50,16,'#ffe27a')}
    ctx.restore()}
  ctx.globalAlpha=k;
  if(endHint){txt(endHint.s,W/2,512,14,'rgba(255,255,255,.85)','center')}
  // play again (uses a heart)
  const ok=true,ready=t-endT>1.8;
  ctx.fillStyle=ok?'#ffd34a':'rgba(255,255,255,.15)';ctx.beginPath();ctx.roundRect(BTN.x-BTN.w/2,BTN.y-BTN.h/2,BTN.w,BTN.h,16);ctx.fill();
  if(ok){txt('Play again',BTN.x,BTN.y+8,24,'#3b2a22','center')}
  else{const s2=Math.ceil(nextHeartIn()/1000);txt('next ♥ '+Math.floor(s2/60)+':'+String(s2%60).padStart(2,'0'),BTN.x,BTN.y+7,20,'rgba(255,255,255,.7)','center')}
  if(!ready)ctx.globalAlpha=1;ctx.globalAlpha=1}
let endHint=null;
function overTap(p){if(t-endT<1.2)return;
  for(const c of shop)if(!c.sold&&Math.abs(p.x-c.x)<46&&Math.abs(p.y-c.y-14)<48){
    if(boatItems.length>=ITEM_MAX){endHint={s:'Seats are full: use an item first'};c.shakeT=.6;tone(200,.15,'square',.08);return}
    if(wallet>=c.price){wallet-=c.price;piggyShow=wallet;c.sold=true;boatItems.push(c.k);saveItems();try{localStorage.setItem('wadWallet',wallet)}catch(e){}
      endHint={s:ITEMS[c.k].icon+' '+ITEMS[c.k].desc};tone(880,.1,'triangle',.12);setTimeout(()=>tone(1320,.14,'triangle',.12),90)}
    else{poorT=.6;c.shakeT=.6;endHint={s:'Not enough coins!'};tone(200,.15,'square',.08);setTimeout(()=>tone(150,.2,'square',.08),120)}
    return}
  if(t-endT>1.8&&Math.abs(p.x-BTN.x)<BTN.w/2&&Math.abs(p.y-BTN.y)<BTN.h/2+6)playAgain()}

function draw(){
  ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*12*shake,(Math.random()-.5)*12*shake);
  drawBG();drawMood();drawRainbow();drawPlay();if(state==='intro')drawIntro();
  for(const j of jumpers)if(j.t>=0)drawFrog(j.st,j.sp,j.x,j.y,STAGES[j.st].r*.8,j.t*6,1);
  ctx.restore();
  if(state==='play'&&wave==='event'&&evKind==='eggs'){ctx.globalAlpha=.6;for(let i=0;i<10;i++){const x=(i*71+20)%W,y=((t*90+i*57)%(H-120))+TOP;drawFrog(0,null,x,y,6,0,1)}ctx.globalAlpha=1}
  if(state==='play')drawBanner();
  if(state==='play'&&phewT>0){const pop=Math.max(0,phewT-1.05)/.25,a=Math.min(1,phewT*2.5);ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,H*.42);ctx.scale(1+.5*pop,1+.5*pop);txt('Phew!',0,0,44,'#c8ff9e','center');ctx.restore();ctx.globalAlpha=1}
  // streak praise: pops in big at the top centre on each hit, then settles and fades while the streak lasts
  if(state==='play'&&streak>=2&&praiseT>0){const p=praiseFor(streak),pop=Math.max(0,praiseT-.75)/.25,sc=1+.45*pop,a=Math.min(1,praiseT*2.5);
    ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,H*.5);ctx.rotate(Math.sin(t*3)*.03);ctx.scale(sc,sc);txt(p[1],0,0,Math.min(48,30+streak*1.5),p[2],'center');ctx.restore();ctx.globalAlpha=1}
  if(state==='play')for(const c of coinFly){if(c.t<0)continue;const k=Math.min(1,c.t/c.dur),e=k*k;coinIcon(c.x+(20-c.x)*e,c.y+(26-c.y)*e-Math.sin(k*Math.PI)*40,6-2*k)}
  if(state==='play'){coinIcon(20,26,9);ctx.save();ctx.translate(34,34);const sc=1+coinPop;ctx.scale(sc,sc);txt(String(coins),0,0,24,'#ffe27a');ctx.restore();
    txt(Math.floor(meters)+' m',W-14,34,22,'#ffffff','right');drawGauge();
    if(tut)drawTutHand();else if(bucketTip&&load>.5){const bi=boatItems.indexOf('bucket');if(bi>=0)handTap(SEATS[bi][0],SEATS[bi][1])}else if((thrown===0&&t>.8)||(load>.8&&idleT>1.5&&!drag))drawSwipe()}   // when stuck heavy: the hand shows the swipe again
  if(state==='start'||state==='intro')drawStart();
  if(state==='cont')drawCont();
  if(state==='ad')drawAd();
  if(state==='over')drawOver();
  if(state==='card')drawCard();
  if(state==='restart'){drawGauge();coinIcon(20,26,9);txt('0',34,34,24,'#ffe27a')}}

// ---------- input ----------
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{const p=pt(e);audioOn();idleT=0;
  if(state==='start'){if(Math.hypot(p.x-TUT_BTN[0],p.y-TUT_BTN[1])<28)tutDoneFlag=false;beginIntro();return}   // ? = play the tutorial again
  if(state==='intro')return;
  if(state==='cont'){if(t-endT<.8)return;if(Math.hypot(p.x-CONT_BTN.x,p.y-CONT_BTN.y)<CONT_BTN.r+12){state='ad';adT=0}else if(p.y>NO_BTN.y)finishOver();return}
  if(state==='ad')return;
  if(state==='over'){overTap(p);return}
  if(state==='restart')return;
  if(state==='card'){if(cardT>.6){state='play';card=null}return}
  cv.setPointerCapture(e.pointerId);
  const ii=itemAt(p);if(ii>=0){const k=boatItems.splice(ii,1)[0];saveItems();useItem(k);return}
  lastP=p;if(swat(p,0,0))return;
  if(p.y>300&&raft.length)drag={x:p.x,y:p.y,cx:p.x,cy:p.y}});
cv.addEventListener('pointermove',e=>{const p=pt(e);if(state==='play'&&e.buttons&&lastP){if(swat(p,p.x-lastP.x,p.y-lastP.y)){lastP=p;drag=null;return}}lastP=p;if(!drag)return;drag.cx=p.x;drag.cy=p.y;});
cv.addEventListener('pointerup',e=>{lastP=null;if(!drag||state!=='play'){drag=null;return}const p=pt(e);drag.cx=p.x;drag.cy=p.y;
  if(aiming()&&cool<=0){const[nx,ny]=aimDir(drag.cx-drag.x,drag.cy-drag.y);throwFrog(nx,ny)}drag=null});
cv.addEventListener('pointercancel',()=>drag=null);

let last=performance.now();
function loop(now){const dt=Math.min(1/30,(now-last)/1000);last=now;
  if(state==='restart'){restartT+=dt;for(const j of jumpers){j.t+=dt;if(j.t<0)continue;j.x+=j.vx*dt;j.y+=j.vy*dt;j.vy+=900*dt}
    jumpers=jumpers.filter(j=>j.y<H+60);if(restartT>=RESTART_TIME){state='play';jumpers=[]}}
  if(state==='cont'){contT+=dt;if(contT>=CONT_WAIT)finishOver()}
  if(state==='ad'){adT+=dt;if(adT>=AD_TIME)resumeAfterAd()}
  for(const c of shop)if(c.shakeT>0)c.shakeT-=dt;poorT=Math.max(0,poorT-dt);
  if(hitstop>0){hitstop-=dt;draw();requestAnimationFrame(loop);return}
  if(state==='card'){cardT+=dt;draw();requestAnimationFrame(loop);return}
  if(state==='play'){if(slowT>0){slowT-=dt;update(dt*.3)}else update(dt)}else{t+=dt;for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}parts=parts.filter(p=>p.life>0);if(state==='intro'&&intro)introUpdate(dt)}
  draw();requestAnimationFrame(loop)}
raft=[{st:4,sp:'green'}];   // the title: one green frog waits on the bow
requestAnimationFrame(loop);

}
</script>
