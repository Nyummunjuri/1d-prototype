const ART_FILE={};
const artNames=()=>ART.flatMap(e=>[e.id,...(e.frames||[]).map(f=>e.id+'_'+f),...(e.parts||[]).map(p=>e.id+'__'+p),...(e.parts||[]).flatMap(p=>(e.frames||[]).map(f=>e.id+'__'+p+'_'+f))]);
function artFile(id,frame){const e=artEntry(id);if(frame&&ART_FILE[id+'_'+frame])return ART_FILE[id+'_'+frame];
  // a plain <id> file stands for the piece when it has no frames, or for its first frame
  if(!frame||!e.frames||e.frames[0]===frame)return ART_FILE[id]}
// Files are only requested when assets/manifest.json lists them: {"plant_carrot_full":"plant_carrot_full.png"} (or a list of file names).
// No manifest (or an empty one) = everything is drawn by code and no image is requested. The game never waits for images.
const ART_FILES_READY=(async()=>{if(location.protocol==='file:')return;let list;
  try{const r=await fetch('assets/manifest.json',{cache:'no-cache'});if(!r.ok)return;list=await r.json()}catch(e){return}
  // background music is listed in the same manifest: {"bgm":"bgm.mp3"} (or a bgm.* file in the list)
  const bg=list&&!Array.isArray(list)?list.bgm:(list||[]).find(f=>/^bgm\./i.test(String(f)));if(bg&&/\.(mp3|ogg|m4a|wav)$/i.test(String(bg))&&typeof loadBgm==='function')loadBgm('assets/'+bg);
  const names=new Set(artNames()),want={};
  // map form {"<id>|<id>_<frame>|<id>__<part>":"file.png"} (what Asset Studio writes), or a plain list of file names
  if(list&&!Array.isArray(list))Object.entries(list).forEach(([k,f])=>{if(names.has(k)&&/\.(svg|png)$/i.test(String(f)))want[k]=String(f)});
  else(list||[]).forEach(f=>{const m=/^(.+)\.(svg|png)$/.exec(String(f));if(m&&names.has(m[1])&&(!want[m[1]]||m[2]==='svg'))want[m[1]]=m[0]});
  await Promise.all(Object.entries(want).map(([n,f])=>new Promise(res=>{const i=new Image();i.onload=()=>{ART_FILE[n]=i;artSwap();res()};i.onerror=res;i.src='assets/'+f})))})();

const artCache=new Map();let artPx=0;

  artCache.set(key,c);artPx+=W*H;while(artPx>12e6&&artCache.size>1){const k=artCache.keys().next().value;const o=artCache.get(k);artPx-=o.width*o.height;artCache.delete(k)}return c}

  if(id===e.id&&e.parts){e.parts.forEach(p=>{const f=artFile(id+'__'+p,frame);if(f)X.drawImage(f,0,0,e.w,e.h);else{X.save();ARTFN[id+'__'+p](X,frame);X.restore()}});return}

const QPOOL=[{t:'sell',n:20,pts:40,ic:'icon_coin',txt:'Sell 20'},{t:'plot',n:3,pts:40,ic:'icon_star',txt:'Finish 3 plots'},{t:'claim',n:1,pts:30,ic:'icon_grandma',txt:"Grandma's request"},
  {t:'water',n:6,pts:30,ic:'icon_drop',txt:'Water 6 times'},{t:'seed',n:1,pts:30,ic:'icon_seed',txt:'Plant a seed'},{t:'tool',n:1,pts:30,ic:'icon_bag',txt:'Use a tool'}];
const PASS_N=15,PASS_PTS=100;
const PF=[{energy:20},{coins:40},{hoe:1},{gems:5},{seeds:2},{energy:30},{coins:80},{tractor:1},{gems:5},{seeds:2},{energy:40},{coins:120},{hoe:2},{gems:10},{seeds:3}];

function quests(){const d=new Date().toDateString();if(!S.q||S.q.day!==d){const p=[...QPOOL].sort(()=>Math.random()-.5).slice(0,3);S.q={day:d,list:p.map(q=>({...q,got:0,done:false}))};saveS()}return S.q.list}
function questAdd(t,n){if(typeof S==='undefined')return;quests().forEach(q=>{if(q.t!==t||q.done)return;q.got=Math.min(q.n,q.got+n);if(q.got>=q.n){q.done=true;S.pass.pts+=q.pts;passTick();
  if(SCREEN!=='none')toast(`${artIcon('icon_ticket')} +${q.pts}`)}});saveS();if(!$('passP').hidden)renderPass()}
function passTick(){if(!S.pass.end||Date.now()>S.pass.end){S.pass={pts:S.pass.end?0:S.pass.pts,f:{},p:{},prem:false,end:Date.now()+30*DAY}}}
const passLvl=()=>Math.min(PASS_N,Math.floor(S.pass.pts/PASS_PTS));
const passClaimable=()=>{if(typeof S==='undefined'||!S.pass)return false;const l=passLvl();for(let k=0;k<l;k++){if(!S.pass.f[k])return true;if(S.pass.prem&&!S.pass.p[k])return true}return false};

  for(let k=0;k<PASS_N;k++){const st=(t,got)=>got?'got':k<l&&(t==='f'||S.pass.prem)?'can':t==='p'&&!S.pass.prem?'lock':'';
    h+=`<div class="tier"><button class="rw ${st('f',S.pass.f[k])}" data-t="f" data-k="${k}">${rwIcon(PF[k])}</button><span class="lv ${k<l?'on':''}">${k+1}</span><button class="rw prem ${st('p',S.pass.p[k])}" data-t="p" data-k="${k}">${rwIcon(PP[k])}</button></div>`}
  $('passList').innerHTML=h.replace(/^<button[^>]*premBuy[^>]*>[^<]*<\/button>/,'');$('passList').insertAdjacentHTML('beforebegin','');
  const old=$('passP').querySelector('.premBuy');if(old)old.remove();if(!S.pass.prem)$('passList').insertAdjacentHTML('beforebegin',`<button class="price premBuy" data-buy="prem">Unlock Premium · $4.99</button>`);
  const inT=S.pass.pts-l*PASS_PTS;$('passBar').innerHTML=l>=PASS_N?'<b>MAX</b>':`${artIcon('icon_ticket').replace('<svg ','<svg style="width:20px;height:20px" ')}<span class="bar"><i style="width:${inT/PASS_PTS*100}%"></i></span><b>${inT}/${PASS_PTS}</b>`;
  $('questRow').innerHTML=quests().map(q=>`<div class="quest${q.done?' done':''}">${artIcon(q.ic).replace('<svg ','<svg style="width:26px;height:26px" ')}<div>${q.txt}</div><div class="qb"><i style="width:${q.got/q.n*100}%"></i></div><div>${q.got}/${q.n}</div><div class="pp">${artIcon('icon_ticket')}+${q.pts}</div></div>`).join('');metaHud()}
