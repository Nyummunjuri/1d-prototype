<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Picky Farm v.2 – test plots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#22361a;--card:#fff8ea;--line:#e6d8b8;--water:#3fa3dc;--grass:#8fbf5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#6f9e45;font-family:Fredoka,system-ui,sans-serif;color:var(--ink);overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
.app{position:relative;max-width:440px;height:100%;margin:0 auto;background:radial-gradient(120% 70% at 50% 40%,#a6d16c,#86b852);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:5px;padding:10px 8px 4px}
header .btn{min-width:36px;min-height:38px;padding:0 6px}
header h1{margin:0;font-size:17px;font-weight:700;flex:1;line-height:1}
header h1 small{display:block;font-size:13px;font-weight:500;opacity:.75;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,248,234,.85);border-radius:999px;padding:4px 8px 4px 6px;font-weight:600;font-size:15px}
.pill svg{width:18px;height:18px}
.btn{font:inherit;font-weight:600;border:0;border-radius:14px;min-height:40px;min-width:40px;padding:0 12px;background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
main{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
footer{padding:6px 10px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#tray{display:grid;gap:8px}
.card{position:relative;font:inherit;color:var(--ink);background:var(--card);border:3px solid transparent;border-radius:18px;padding:0;height:104px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none;cursor:grab}
.card .mound{width:100%;height:66px;display:grid;place-items:end center;position:relative}
.card .mound i{position:absolute;left:12%;right:12%;bottom:4px;height:20px;border-radius:50%}
.card canvas{position:relative;width:60px;height:60px;margin-bottom:2px}
.card .n{font-size:24px;font-weight:700;line-height:1;margin-top:5px}
.card .rule{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.card .rule svg{width:19px;height:19px}
.card .badge{position:absolute;top:3px;right:4px;width:30px;height:30px;display:grid;place-items:center;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.card .badge svg{width:30px;height:30px}
.card.on{border-color:#3c8a30}
.card.done{opacity:.42;box-shadow:none;transform:translateY(4px)}
.card.done .n{font-size:0}
.card.done .n::after{content:'✓';font-size:24px}
#water{width:100%;min-height:54px;font-size:19px;background:var(--water);color:#fff;box-shadow:0 4px 0 #2a7fae;display:flex;align-items:center;justify-content:center;gap:8px}
#water svg{width:22px;height:22px}
#water .cost{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.22);border-radius:999px;padding:2px 9px 2px 5px;font-size:16px}
#water .cost svg{width:16px;height:16px}
#water:disabled{background:#a9c3cf;box-shadow:none;transform:translateY(4px);color:#eef4f7}
#water.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.035)}}
#ghost{position:fixed;left:0;top:0;width:64px;height:64px;pointer-events:none;z-index:30;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
#ghost[hidden]{display:none}
#win{position:absolute;inset:0;z-index:40;background:rgba(34,54,26,.45);display:grid;place-items:center}
#win[hidden]{display:none}
.panel{background:var(--card);border-radius:24px;padding:20px 22px 18px;width:min(320px,88%);text-align:center;box-shadow:0 6px 0 var(--line);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.panel h2{margin:0 0 4px;font-size:30px}
#stars{display:flex;justify-content:center;gap:4px;margin:4px 0 10px}
#stars svg{width:50px;height:50px;opacity:.18;transform:scale(.8);transition:transform .35s cubic-bezier(.3,1.8,.5,1),opacity .2s}
#stars svg:nth-child(2){width:60px;height:60px;margin-top:-8px}
#stars svg.on{opacity:1;transform:scale(1)}
.rows{display:flex;flex-direction:column;gap:7px;margin:0 0 14px}
.row{display:flex;align-items:center;gap:10px;background:#f3ecd9;border-radius:12px;padding:7px 10px;font-size:16px;text-align:left}
.row svg{width:24px;height:24px;flex:none}
.row b{margin-left:auto;font-size:18px}
.row.no{opacity:.55}
.row.bonus{background:#fff1b8}
.btns{display:flex;gap:10px}.btns .btn{flex:1;min-height:48px;font-size:17px}
#next{background:#3c8a30;color:#fff;box-shadow:0 4px 0 #2a6321}
#infoP{position:absolute;inset:0;z-index:45;background:rgba(34,54,26,.45);display:grid;place-items:center}#infoP[hidden]{display:none}
.row .soilchip{width:24px;height:16px;border-radius:50%;flex:none}

.flystar{position:fixed;left:0;top:0;width:40px;height:40px;z-index:60;pointer-events:none}
.spark{position:fixed;left:0;top:0;width:6px;height:6px;border-radius:50%;background:#ffe27a;z-index:61;pointer-events:none}
#hand{position:fixed;left:0;top:0;width:46px;pointer-events:none;z-index:55;transform-origin:18px 4px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25))}
#hand[hidden]{display:none}
#hand canvas{position:absolute;width:48px;height:48px;left:-34px;top:-40px}
#intro{position:absolute;inset:0;z-index:70;background:radial-gradient(120% 75% at 50% 38%,#c4e891,#8fc35a);display:grid;place-items:center;transition:opacity .45s;color:#22361a}
#intro.out{opacity:0;pointer-events:none}#intro[hidden]{display:none}
#load{display:flex;flex-direction:column;align-items:center}#load b{font-size:30px;font-weight:700;margin-bottom:18px}#loadCv{width:260px;height:78px}
#water.off{background:#a9c3cf;box-shadow:none;transform:translateY(4px);color:#eef4f7}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;display:flex;gap:6px;align-items:center}
#toast.on{opacity:1}
#toast svg{width:18px;height:18px}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1 style="white-space:nowrap"><span id="lvl">Plot 1/4</span></h1>
    <span class="pill" id="turnsP" title="Turns"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5" stroke="#3c8a30" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M17.5 2.5v5h-5" stroke="#3c8a30" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="turns">0</span><small style="opacity:.55;font-weight:500">/<span id="target">0</span></small></span>
    <span class="pill" title="Energy"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#ffc93a" stroke="#d39a14" stroke-width="1.4" stroke-linejoin="round"/></svg><span id="energy">100</span></span>
    <button class="btn" id="prev" aria-label="Previous plot" style="font-size:20px">‹</button><button class="btn" id="skip" aria-label="Next plot" style="font-size:20px">›</button>
    <button class="btn" id="info" aria-label="What the symbols mean" style="background:#ffc93a;color:#5a3d00;box-shadow:0 3px 0 #d39a14;font-size:19px;font-weight:700;font-family:Georgia,serif">i</button>
    <button class="btn" id="reset" aria-label="Restart plot"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 12a7 7 0 1 0 2.1-5" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M6.5 2.5v5h5" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </header>
  <main id="board"><canvas id="cv"></canvas><div id="toast"></div>
    <div id="win" hidden><div class="panel">
      <h2 id="winT">Harvest!</h2>
      <div id="stars"></div>
      <div class="rows" id="rows"></div>
      <div class="btns"><button class="btn" id="again">Replay</button><button class="btn" id="next">Next</button></div>
    </div></div>
  </main>
  <div id="infoP" hidden><div class="panel" style="text-align:left">
    <h2 style="text-align:center;font-size:24px;margin-bottom:10px">Picky plants</h2>
    <div class="rows" id="infoRows"></div>
    <div class="btns"><button class="btn" id="infoClose" style="background:#3c8a30;color:#fff;box-shadow:0 4px 0 #2a6321">Got it</button></div></div></div>
  <footer>
    <div id="tray"></div>
    <button class="btn" id="water"><svg viewBox="0 0 24 24"><path d="M12 2C9 7 5 10.5 5 15a7 7 0 0 0 14 0c0-4.5-4-8-7-13z" fill="#fff"/></svg>Water<span class="cost"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#ffe27a"/></svg>10</span></button>
  </footer>
  <canvas id="ghost" hidden></canvas>
  <div id="hand" hidden><canvas id="handSeed"></canvas><svg viewBox="0 0 48 56"><path d="M18 3c3 0 5 2 5 5v17l2-1v-5c0-3 5-3 5 0v6l2-1v-2c0-3 5-3 5 0v4h1c0-3 5-3 5 0v13c0 9-6 15-15 15h-3c-6 0-10-3-13-8L4 32c-2-3 2-6 5-4l4 4V8c0-3 2-5 5-5z" fill="#fff" stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
  <div id="intro"><div id="load"><b>Picky Farm</b><canvas id="loadCv"></canvas></div></div>
</div>
<script>
const LEVELS=[{"r": 4, "c": 4, "soil": "ssslsPllssllssll", "holes": [4, 2, 9, 4, 9, 0, 10, 6, 12, 11, 12, 4, 5, 8, 1, 8], "rocks": [], "fence": [], "seeds": {"carrot": 5, "barrel": 3, "lettuce": 5}, "target": 11, "sol": "CCXLCPLLXCL-XCL-", "solved": [4, 4, 3, 4, 3, 0, 10, 9, 3, 7, 12, 4, 5, 1, 1, 8]}, {"r": 4, "c": 5, "soil": "lllsslPlssllsssllsss", "holes": [1, 4, 1, 4, 1, 9, 0, 7, 13, 9, 2, 1, 11, 10, 12, 10, 1, 12, 8, 1], "rocks": [], "fence": [], "seeds": {"lettuce": 6, "barrel": 3, "carrot": 7, "potato": 1}, "target": 12, "sol": "LLXCCLPLCCXLCC-XLC-K", "solved": [4, 4, 1, 4, 4, 3, 0, 14, 11, 9, 2, 1, 7, 10, 12, 10, 2, 9, 8, 1]}, {"r": 4, "c": 5, "soil": "sslllsPlllssllllllss", "holes": [1, 6, 6, 6, 4, 1, 0, 10, 6, 5, 2, 11, 14, 4, 3, 8, 9, 1, 12, 4], "rocks": [9], "fence": [[15, "S"], [16, "S"]], "seeds": {"carrot": 4, "barrel": 3, "lettuce": 5, "cucumber": 2}, "target": 13, "sol": "CCXLLCPLUrXCLU-UULX-", "solved": [2, 12, 6, 6, 8, 2, 0, 10, 9, 5, 2, 7, 14, 8, 3, 2, 9, 1, 9, 4]}, {"r": 5, "c": 5, "soil": "cccclcPcllccllllclccll.cc", "holes": [2, 6, 2, 6, 4, 1, 0, 14, 14, 2, 3, 10, 1, 5, 3, 1, 13, 2, 12, 4, 2, 12, 0, 3, 2], "rocks": [], "fence": [], "seeds": {"tomato": 9, "barrel": 4, "marigold": 3, "lettuce": 4}, "target": 17, "sol": "TTXTBTPTB-XTLL-BTXTTLL.X-", "solved": [2, 12, 2, 6, 8, 2, 0, 14, 13, 2, 6, 5, 1, 5, 3, 2, 13, 2, 3, 8, 2, 9, 0, 12, 8]}];
function poly(X,pts,fill){X.beginPath();pts.forEach(([x,y],k)=>k?X.lineTo(x,y):X.moveTo(x,y));X.closePath();X.fillStyle=fill;X.fill()}
function disc(X,x,y,r,a,b){X.fillStyle=a;X.beginPath();X.arc(x,y,r,0,7);X.fill();if(b){X.fillStyle=b;X.beginPath();X.arc(x,y,r,-1.57,1.57);X.fill()}}
function oval(X,x,y,rx,ry,rot,f){X.fillStyle=f;X.beginPath();X.ellipse(x,y,rx,ry,rot,0,7);X.fill()}
function leaf(X,ang,len,w,c1,c2,ox=0,oy=0){const ex=Math.cos(ang)*len,ey=Math.sin(ang)*len,px=Math.cos(ang+1.57)*w,py=Math.sin(ang+1.57)*w;
  poly(X,[[ox,oy],[ox+px+ex*.5,oy+py+ey*.5],[ox+ex,oy+ey]],c1);poly(X,[[ox,oy],[ox-px+ex*.5,oy-py+ey*.5],[ox+ex,oy+ey]],c2)}
const SPR={
  radish(X,s){[-2.1,-1.57,-1.05].forEach((a,n)=>leaf(X,a,s*.3,s*.07,'#3c9a35','#5cbf4a',0,-s*.06));
    poly(X,[[-s*.035,s*.13],[s*.035,s*.13],[0,s*.25]],'#f6e9ee');disc(X,0,s*.02,s*.15,'#ee5a8f','#c9306a');oval(X,-s*.06,-s*.03,s*.04,s*.025,-.6,'#ffc2d8')},
  carrot(X,s){poly(X,[[-s*.13,0],[s*.13,0],[s*.07,s*.12],[-s*.07,s*.12]],'#e6781a');poly(X,[[0,0],[s*.13,0],[s*.07,s*.12],[0,s*.12]],'#c9620f');
    [[-.16,-.32],[0,-.38],[.16,-.32]].forEach(([dx,dy],n)=>poly(X,[[-s*.04,0],[s*.04,0],[s*dx,s*dy]],n%2?'#4fae40':'#3c9a35'))},
  lettuce(X,s){for(let a=0;a<7;a++){const an=a/7*6.283;oval(X,Math.cos(an)*s*.17,Math.sin(an)*s*.13-s*.02,s*.14,s*.09,an,a%2?'#6fbf3c':'#86d24b')}
    disc(X,0,-s*.02,s*.12,'#b5e66a','#9fd655');disc(X,-s*.02,-s*.04,s*.06,'#d8f59c')},
  blueberry(X,s){[-2.6,-.5,2.4,.7].forEach((a,n)=>leaf(X,a,s*.3,s*.08,'#2f7d3a','#3f9a46'));
    [[-.1,0],[.09,-.05],[.02,.09],[-.04,-.12],[.13,.07]].forEach(([x,y])=>{disc(X,s*x,s*y,s*.075,'#4a64d8','#33479f');disc(X,s*x-s*.02,s*y-s*.025,s*.018,'#b9c6ff')})},
  corn(X,s){poly(X,[[0,s*.12],[-s*.33,-s*.2],[-s*.04,0]],'#4fae40');poly(X,[[0,s*.12],[s*.33,-s*.16],[s*.04,0]],'#3c9a35');
    poly(X,[[0,-s*.34],[s*.085,-s*.24],[s*.085,s*.07],[0,s*.13],[-s*.085,s*.07],[-s*.085,-s*.24]],'#ffd84a');poly(X,[[0,-s*.34],[s*.085,-s*.24],[s*.085,s*.07],[0,s*.13]],'#e9b822');
    for(let y=-.25;y<.07;y+=.07){disc(X,-s*.04,s*y,s*.017,'#fff0a0');disc(X,s*.035,s*y+s*.03,s*.017,'#ffe27a')}
    poly(X,[[0,s*.15],[-s*.15,-s*.06],[-s*.05,s*.1]],'#79c94e');poly(X,[[0,s*.15],[s*.15,-s*.06],[s*.05,s*.1]],'#5fb24a')},
  tomato(X,s){disc(X,0,s*.03,s*.18,'#ff4b3a','#d22a1c');oval(X,-s*.07,-s*.04,s*.05,s*.03,-.6,'#ff9a8a');
    for(let a=0;a<5;a++){const an=a/5*6.283-1.57;poly(X,[[0,-s*.12],[Math.cos(an-.3)*s*.05,-s*.12+Math.sin(an-.3)*s*.05],[Math.cos(an)*s*.12,-s*.12+Math.sin(an)*s*.1]],a%2?'#3c9a35':'#4fae40')}
    poly(X,[[-s*.015,-s*.12],[s*.015,-s*.12],[s*.02,-s*.2],[-s*.005,-s*.2]],'#3c7a2a')},
  eggplant(X,s){X.save();X.rotate(-.55);oval(X,0,s*.04,s*.12,s*.21,0,'#5b2a82');oval(X,-s*.02,s*.03,s*.095,s*.19,0,'#8a45bd');oval(X,-s*.05,s*.0,s*.02,s*.1,0,'#c79ae8');
    poly(X,[[-s*.1,-s*.13],[s*.1,-s*.13],[s*.05,-s*.2],[0,-s*.15],[-s*.05,-s*.2]],'#3f9a35');poly(X,[[-s*.02,-s*.18],[s*.02,-s*.18],[s*.02,-s*.28],[-s*.01,-s*.27]],'#2f7d2a');X.restore()},
  cauliflower(X,s){for(let a=0;a<6;a++)leaf(X,a/6*6.283+.3,s*.33,s*.11,'#3f8f35','#58ab45');
    [[0,0,.1],[-.1,-.04,.075],[.1,-.03,.075],[-.06,.08,.075],[.07,.08,.075],[0,-.1,.075],[-.12,.05,.06],[.13,.06,.06]].forEach(([x,y,r])=>{disc(X,s*x,s*y,s*r,'#fbf3df','#e7dcbf');disc(X,s*x-s*r*.3,s*y-s*r*.3,s*r*.35,'#fffaf0')})},
  sunflower(X,s){leaf(X,2.5,s*.32,s*.08,'#3c9a35','#4fae40');leaf(X,.6,s*.32,s*.08,'#3c9a35','#4fae40');
    for(let a=0;a<12;a++){const an=a/12*6.283;poly(X,[[Math.cos(an-.26)*s*.1,Math.sin(an-.26)*s*.1-s*.04],[Math.cos(an)*s*.27,Math.sin(an)*s*.27-s*.04],[Math.cos(an+.26)*s*.1,Math.sin(an+.26)*s*.1-s*.04]],a%2?'#f5a90f':'#ffc927')}
    disc(X,0,-s*.04,s*.11,'#7a4520','#5b3115');for(let a=0;a<6;a++)disc(X,Math.cos(a)*s*.055,-s*.04+Math.sin(a)*s*.055,s*.016,'#a8692f')},
  watermelon(X,s){leaf(X,-2.3,s*.25,s*.09,'#3c9a35','#4fae40',s*.05,-s*.12);
    X.save();X.beginPath();X.ellipse(0,s*.03,s*.29,s*.2,-.15,0,7);X.clip();oval(X,0,s*.03,s*.29,s*.2,-.15,'#3a9a44');
    [-.18,-.06,.06,.18].forEach(x=>oval(X,s*x,s*.03,s*.035,s*.22,-.15,'#1f6a2a'));oval(X,-s*.1,-s*.06,s*.1,s*.04,-.3,'rgba(255,255,255,.22)');X.restore();
    X.strokeStyle='#3c9a35';X.lineWidth=s*.02;X.beginPath();X.arc(s*.24,-s*.16,s*.05,3,7.5);X.stroke()},
  rice(X,s){X.lineCap='round';
    [[-.16,'#7fae3a'],[-.06,'#8fbf45'],[.05,'#7fae3a'],[.15,'#8fbf45']].forEach(([a,c])=>{X.strokeStyle=c;X.lineWidth=s*.035;X.beginPath();X.moveTo(a*s*.4,s*.16);X.quadraticCurveTo(a*s*.6,-s*.05,a*s*1.6,-s*.3);X.stroke()});
    [[-.2,-.28,-.5],[.02,-.36,-.1],[.22,-.26,.45]].forEach(([x,y,r])=>{X.save();X.translate(x*s,y*s);X.rotate(r);for(let k=0;k<5;k++){X.fillStyle=k%2?'#f2cf5b':'#e3b83c';X.beginPath();X.ellipse(0,k*s*.045,s*.03,s*.022,0,0,7);X.fill()}X.restore()})},
  lotus(X,s){X.fillStyle='#3f9a4a';X.beginPath();X.ellipse(0,s*.12,s*.3,s*.1,0,0,7);X.fill();X.fillStyle='#57b85e';X.beginPath();X.moveTo(0,s*.12);X.ellipse(0,s*.12,s*.3,s*.1,0,.3,6.1);X.fill();
    const pet=(a,l,c)=>{X.save();X.translate(0,s*.04);X.rotate(a);X.fillStyle=c;X.beginPath();X.moveTo(0,0);X.quadraticCurveTo(-l*.42,-l*.55,0,-l);X.quadraticCurveTo(l*.42,-l*.55,0,0);X.fill();X.restore()};
    pet(-1.05,s*.26,'#ff9cc6');pet(1.05,s*.26,'#ff9cc6');pet(-.5,s*.32,'#ff7eb6');pet(.5,s*.32,'#ff7eb6');pet(0,s*.36,'#ffb3d4');
    X.fillStyle='#ffd23a';X.beginPath();X.arc(0,-s*.04,s*.035,0,7);X.fill()},
  barrel(X,s){poly(X,[[-s*.17,s*.05],[s*.17,s*.05],[s*.13,s*.19],[-s*.13,s*.19]],'#c9774a');
    X.fillStyle='#7fae3a';X.beginPath();X.ellipse(0,-s*.08,s*.19,s*.16,0,0,7);X.fill();
    X.strokeStyle='#a5cf55';X.lineWidth=s*.022;[-.1,0,.1].forEach(a=>{X.beginPath();X.ellipse(s*a,-s*.08,s*.04,s*.15,0,0,7);X.stroke()});
